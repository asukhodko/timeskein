    kind: task
    parent: ts.context_fabric
    status: planned
    effort: 3
    deps:
      - id: ts.causal_memory.provenance_contract
      - id: ts.causal_memory.working_memory_gate
      - id: ts.stewardship.gate
      - id: ts.trust.minimum_policy_gate
    notes: Support one idempotent source with Artifact and Observation envelopes, provenance, sensitivity, content_trust, temporal precision, timestamps, correlation to an active Focus Session, and an explicit retention/deletion policy.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: context
        architecture_layer: canonical
        success_signal: One machine observation can be ingested, traced, corrected, and revoked.
        privacy_class: high
  ts.context_fabric.bounded_probe:
    title: Run a bounded active-app and browser-context probe
    kind: experiment
    parent: ts.context_fabric
    status: planned
    effort: 5
    deps:
      - id: ts.context_fabric.observation_envelope
    notes: Collect only during a manually active Focus Session, start with active app and optional URL from one source, keep a visible indicator, cap raw TTL at 72 hours, exclude screen content, build the same consumer-neutral Context Pack, and compare re-entry and Track-review value against the manual trace.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: context
        architecture_layer: ephemeral
        assumption: Automatic context provides more re-entry or evidence value than noise and privacy cost.
        success_signal: Re-entry time or evidence quality improves with an acceptable correction rate.
        privacy_class: high
  ts.context_fabric.bounded_probe_gate:
    title: Automatic context proves value and trust
    kind: milestone
    parent: ts.context_fabric
    status: planned
    milestone: true
    effort: 1
    deps:
      - id: ts.context_fabric.bounded_probe
    notes: Decide whether to build Context Fabric, narrow the probe, or stop the branch. Code completion alone does not pass this gate.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: context
        architecture_layer: derived
        assumption: The user trusts the source and uses its distilled output.
        success_signal: Useful distilled facts per raw observation are positive, privacy failures are zero, and manual correction remains manageable.
        privacy_class: high
        dogfood_gate: bounded-context-real-work

  ts.intelligence:
    title: Explainable Episodes and Private Intelligence
    kind: capability
    parent: ts
    status: deferred
    notes: Build correctable Episodes and Threads, in-app reflection, redacted LLM packs, and cited interpretations only after causal and context gates are meaningful.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: intelligence
        architecture_layer: derived
        success_signal: Machine assistance improves decisions while every conclusion remains inspectable and optional.
