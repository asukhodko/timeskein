version: 3

nodes:
  ts:
    title: Timeskein
    kind: product
    status: in_progress
    notes: Local-first causal work memory and steering system. The accepted manual foundation already covers daily control, in-day structure, arbitrary-period reflection, semantic Tracks/Labels, and evidence-backed Track stories. The strategic route now backcasts from Operational Reality, explainable context, private intelligence, multi-device continuity, and opt-in Evidence Mode.
    x:
      ops:
        attention_class: overview
      strategy:
        horizon: north-star
        capability: product
        architecture_layer: all
        success_signal: The user can connect intention, action, change, evidence, decision, and next action across days and Tracks.
        privacy_class: mixed

  ts.causal_memory:
    title: Causal Work Memory
    kind: capability
    parent: ts
    status: in_progress
    notes: Establish the shared causal spine for manual facts, observations, outcomes, decisions, next actions, projections, and future sources without rewriting the whole database.
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Existing and new facts can explain what changed and what should happen next without inventing missing links.
        privacy_class: mixed
  ts.causal_memory.architecture_gate:
    title: Fix the causal model and truth boundaries
    kind: milestone
    parent: ts.causal_memory
    status: done
    milestone: true
    effort: 1
    deps:
      - id: ts.periodic_reflection.context_links
    notes: ADR-0004, RFC-0009, and Roadmap 0005 define user-authoritative state, canonical observations, derived interpretations, ephemeral artifacts, provenance, incremental migration, and the bounded context probe.
    x:
      ops:
        attention_class: done
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: control
        success_signal: Canonical, derived, ephemeral, and control data have explicit boundaries.
        privacy_class: mixed
        dogfood_gate: documentation-and-opskarta-validation
  ts.causal_memory.provenance_contract:
    title: Add shared provenance and observation contracts
    kind: task
    parent: ts.causal_memory
    status: in_progress
    effort: 3
    deps:
      - id: ts.causal_memory.architecture_gate
    notes: "The manual causal slice now stores source/device, occurred/recorded time, schema version, confidence, correlation, and provenance. Sensitivity and derivation metadata remain for the future observation contract and bounded context probe."
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Manual and machine-originated facts can be distinguished and traced.
        privacy_class: mixed
  ts.causal_memory.transition_history:
    title: Preserve manual state and next-action transitions
    kind: task
    parent: ts.causal_memory
    status: done
    effort: 3
    deps:
      - id: ts.causal_memory.architecture_gate
    notes: "Done for v1. Migration 012 stores append-only intent, state assertion, result, decision, next action, confirmation, and correction records. Corrections supersede rather than overwrite, and current tables/APIs remain the operational baseline."
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Operational Reality can explain when and why current state changed.
        privacy_class: ordinary
  ts.causal_memory.timeline_integrity:
    title: Keep focus time non-overlapping and auditable
    kind: task
    parent: ts.causal_memory
    status: done
    effort: 2
    deps:
      - id: ts.causal_memory.transition_history
    notes: "Accepted after the 2026-07-16 dogfood exposed a 9:05 overlap. Rust create/update rejects overlapping stopped intervals, touching boundaries remain valid, day closure and RC checks block on legacy overlaps, and period reports emit an explicit data-trust warning without silently rewriting history."
    x:
      ops:
        attention_class: done
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Tracked duration cannot be accepted while the underlying timeline double-counts time.
        privacy_class: ordinary
  ts.causal_memory.spine_gate:
    title: Causal work spine is queryable and historically honest
    kind: milestone
    parent: ts.causal_memory
    status: done
    milestone: true
    effort: 1
    deps:
      - id: ts.causal_memory.provenance_contract
      - id: ts.causal_memory.transition_history
      - id: ts.causal_memory.timeline_integrity
    notes: "Accepted 2026-07-16. Synthetic, migration/restart, historical as_of, semantic snapshots, evidence Ref, correction, Reflection follow-up, mock, packaged macOS, and period-report gates pass. Real 15–16 July use preserved a complete intent -> result with Ref -> next-action chain and exposed/fixed the timeline-overlap trust boundary."
    x:
      ops:
        attention_class: done
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: A real Track history separates user facts, observations, inference, and unknowns.
        privacy_class: mixed
        dogfood_gate: real-track-causal-history

  ts.causal_memory.working_memory_bridge:
    title: Build a chronological working-memory bridge
    kind: epic
    parent: ts.causal_memory
    status: planned
    effort: 5
    deps:
      - id: ts.causal_memory.spine_gate
    notes: "Candidate after M1. Provide a persistent chronological thought stream, a first-class artifact/material record, comfortable long-note review, optional Work Item stages, and explicit action -> change capture. Dogfood showed that long work can be well timed while its decisions and outcomes remain too thin."
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Long focus blocks leave enough structured change evidence to resume and review without an external notebook.
        privacy_class: mixed

  ts.steering:
    title: Current-State Steering
    kind: capability
    parent: ts
    status: in_progress
    notes: Turn causal history into a live, correctable answer about what is active, waiting, blocked, parked, reactive, stale-important, completed, or still an unresolved tail.
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: derived
        success_signal: Opening Timeskein is enough to choose a justified next action without external archaeology.
        privacy_class: mixed
  ts.steering.manual_correction:
    title: Confirm and correct operational state
    kind: task
    parent: ts.steering
    status: done
    effort: 3
    deps:
      - id: ts.periodic_reflection.operational_reality
    notes: "Implemented in the Operational Reality panel and Local API. The user can confirm or explain a correction, close, wait, block, park, mark reactive/meeting-tail/stale, dismiss or complete a next action, and the causal record preserves the prior assertion."
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: control
        success_signal: A machine suggestion never silently replaces user state.
        privacy_class: ordinary
  ts.steering.operational_reality_gate:
    title: Operational Reality selects the next justified action
    kind: milestone
    parent: ts.steering
    status: done
    milestone: true
    effort: 1
    deps:
      - id: ts.periodic_reflection.operational_reality
      - id: ts.steering.manual_correction
    notes: "Accepted 2026-07-16. The strict 15–16 July gate passed with 2/2 real days, 11/3 starts through `Начать отсюда`, meeting-tail/stale-important/waiting/reactive states, one correction surviving restart, three Reflection follow-ups, one full intent -> result with Ref -> next-action chain, and 2/2 normal closures."
    x:
      ops:
        attention_class: done
      strategy:
        horizon: now
        capability: steering
        architecture_layer: derived
        success_signal: The next action is selected without rebuilding the current work inventory elsewhere.
        privacy_class: mixed
        dogfood_gate: real-day-operational-reality

  ts.steering.workspace_convergence:
    title: Converge Operational Reality, day contract, and inventory
    kind: epic
    parent: ts.steering
    status: planned
    effort: 5
    deps:
      - id: ts.steering.operational_reality_gate
    notes: "Candidate after M1. Operational Reality should remain the source of truth; dispatching should choose 2–3 existing Work Items/Tracks from it into a visible day contract, and the full inventory should serve search, maintenance, deduplication, and hierarchy rather than compete for attention. Keep free text for why-now and parking rationale."
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: steering
        architecture_layer: derived
        success_signal: The user can form and follow the day contract without maintaining three competing representations of current work.
        privacy_class: ordinary

  ts.trust:
    title: Trust, Privacy, and Retention
    kind: capability
    parent: ts
    status: planned
    notes: Cross-cutting control plane for source permissions, sensitivity, pause, purge, revocation, redaction, TTL, storage budget, and audit.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: now-next
        capability: trust
        architecture_layer: control
        success_signal: Every collected datum has an understandable policy and a reliable deletion path.
        privacy_class: high
  ts.trust.minimum_policy_gate:
    title: Define minimum policy controls for a context probe
    kind: milestone
    parent: ts.trust
    status: planned
    milestone: true
    effort: 2
    deps:
      - id: ts.causal_memory.architecture_gate
    notes: Before automatic observation, implement a visible indicator, pause, local-only storage, sensitivity, TTL, purge, and audit for the bounded source.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: trust
        architecture_layer: control
        success_signal: The bounded probe can be stopped and purged without hidden residue.
        privacy_class: high
        dogfood_gate: privacy-control-smoke

  ts.context_fabric:
    title: Context Fabric
    kind: capability
    parent: ts
    status: planned
    notes: Validate automatic context early through a bounded focus-scoped probe, then generalize only proven value into SourceNodes and explicit connectors.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: context
        architecture_layer: canonical
        success_signal: Context sources reduce re-entry cost while remaining explainable, optional, and revocable.
        privacy_class: high
  ts.context_fabric.observation_envelope:
    title: Implement one source observation envelope
    kind: task
    parent: ts.context_fabric
    status: planned
    effort: 3
    deps:
      - id: ts.causal_memory.provenance_contract
      - id: ts.trust.minimum_policy_gate
    notes: Support one idempotent source with provenance, sensitivity, timestamps, correlation to an active Focus Session, and an explicit retention policy.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: context
        architecture_layer: canonical
        success_signal: One machine observation can be ingested, traced, corrected, and revoked.
        privacy_class: high
  ts.context_fabric.bounded_probe:
    title: Run a bounded active-app and browser-context probe
    kind: experiment
    parent: ts.context_fabric
    status: planned
    effort: 5
    deps:
      - id: ts.context_fabric.observation_envelope
    notes: Collect only during a manually active Focus Session, start with one source, keep a visible indicator, cap raw TTL at 72 hours, distill refs/context, and compare re-entry and Track-review value against the manual trace.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: context
        architecture_layer: ephemeral
        assumption: Automatic context provides more re-entry or evidence value than noise and privacy cost.
        success_signal: Re-entry time or evidence quality improves with an acceptable correction rate.
        privacy_class: high
  ts.context_fabric.bounded_probe_gate:
    title: Automatic context proves value and trust
    kind: milestone
    parent: ts.context_fabric
    status: planned
    milestone: true
    effort: 1
    deps:
      - id: ts.context_fabric.bounded_probe
    notes: Decide whether to build Context Fabric, narrow the probe, or stop the branch. Code completion alone does not pass this gate.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: context
        architecture_layer: derived
        assumption: The user trusts the source and uses its distilled output.
        success_signal: Useful distilled facts per raw observation are positive, privacy failures are zero, and manual correction remains manageable.
        privacy_class: high
        dogfood_gate: bounded-context-real-work

  ts.intelligence:
    title: Explainable Episodes and Private Intelligence
    kind: capability
    parent: ts
    status: deferred
    notes: Build correctable Episodes and Threads, in-app reflection, redacted LLM packs, and cited interpretations only after causal and context gates are meaningful.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: intelligence
        architecture_layer: derived
        success_signal: Machine assistance improves decisions while every conclusion remains inspectable and optional.
        privacy_class: mixed
  ts.intelligence.episodes:
    title: Derive explainable work Episodes
    kind: epic
    parent: ts.intelligence
    status: deferred
    effort: 8
    deps:
      - id: ts.steering.operational_reality_gate
      - id: ts.context_fabric.bounded_probe_gate
    notes: Combine manual Focus Sessions and observations into correctable Episodes with source explanations and confidence.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: intelligence
        architecture_layer: derived
        assumption: Derived episodes are accurate enough to reduce re-entry cost.
        success_signal: Re-entry improves after 1, 3, and 7 days and the correction rate is acceptable.
        privacy_class: mixed
  ts.intelligence.threads:
    title: Connect Episodes into semantic Threads
    kind: epic
    parent: ts.intelligence
    status: deferred
    effort: 8
    deps:
      - id: ts.intelligence.episodes
    notes: Keep user-authored Track separate from machine-derived Thread; show and correct why Episodes are connected.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: intelligence
        architecture_layer: derived
        success_signal: Long-running work can be reconstructed without hiding uncertainty.
        privacy_class: mixed

  ts.continuity:
    title: Multi-device Continuity
    kind: capability
    parent: ts
    status: deferred
    notes: Preserve a complete local mode while making canonical facts portable and eventually synchronized across macOS, Windows, and Android surfaces.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: continuity
        architecture_layer: canonical
        success_signal: The same causal history remains available across devices without mandatory cloud dependence.
        privacy_class: mixed
  ts.continuity.sync_readiness:
    title: Keep new canonical facts sync-ready
    kind: task
    parent: ts.continuity
    status: planned
    effort: 3
    deps:
      - id: ts.causal_memory.provenance_contract
    notes: Stable UUIDs, device provenance, idempotent ingest, schema version, and separate observed/recorded time. Do not build Hub or CRDT yet.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: now-next
        capability: continuity
        architecture_layer: canonical
        success_signal: New data does not create an avoidable future sync migration.
        privacy_class: mixed

  ts.full_context:
    title: Opt-in Full Context and Evidence Mode
    kind: capability
    parent: ts
    status: deferred
    notes: Expand only a proven Context Fabric into screen evidence, broader sources, distillation, semantic reconstruction, and strict storage/privacy control.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: full-context
        architecture_layer: ephemeral
        success_signal: Missing context can be reconstructed without turning Timeskein into a life recorder.
        privacy_class: high

  ts.baseline:
    title: Recovery baseline
    kind: phase
    parent: ts
    status: done
    notes: Browser dev mode and macOS app are usable; the Rust agent is embedded in the Tauri app.
    x:
      ops:
        attention_class: done
  ts.baseline.browser_dev:
    title: Browser development mode with mock API
    kind: task
    parent: ts.baseline
    status: done
    effort: 2
    x:
      ops:
        attention_class: done
  ts.baseline.macos_app:
    title: macOS app with embedded Rust agent
    kind: task
    parent: ts.baseline
    status: done
    effort: 4
    deps:
      - id: ts.baseline.browser_dev
    x:
      ops:
        attention_class: done
  ts.baseline.docs:
    title: Current implementation documentation
    kind: task
    parent: ts.baseline
    status: done
    effort: 1
    deps:
      - id: ts.baseline.macos_app
    x:
      ops:
        attention_class: done

  ts.ux_entry:
    title: App entry UX
    kind: phase
    parent: ts
    status: in_progress
    notes: Make opening, moving, hiding, and using the app feel like a fast time-tracking tool rather than a static palette.
    x:
      ops:
        attention_class: done
  ts.ux_entry.window_drag:
    title: Make the app window movable
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.baseline.macos_app
    notes: Header drag uses Tauri startDragging, with buttons excluded from the drag region.
    x:
      ops:
        attention_class: done
  ts.ux_entry.hide_toggle:
    title: Add clear hide and show behavior
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.window_drag
    notes: A shown window must be easy to dismiss without quitting the whole app.
    x:
      ops:
        attention_class: done
  ts.ux_entry.tray_actions:
    title: Wire tray menu actions
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.hide_toggle
    notes: Left-click and Show/Hide toggle the window. The window no longer uses always-on-top or task-switcher hiding, macOS Reopen restores a hidden window, the native shell keeps the menu bar title updated from the local API, show/hide requests are logged for window entrypoints, and dogfood:continue reopens an already started dogfood day through the same guarded app-opening path.
    x:
      ops:
        attention_class: done
  ts.ux_entry.monitor_policy:
    title: Document macOS multi-monitor status item limits
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.tray_actions
    notes: Documented that Timeskein creates one macOS status item and macOS controls which menu bar displays it; reliable alternate entrypoints are Show/Hide, global shortcut, and normal app switching.
    x:
      ops:
        attention_class: done
  ts.ux_entry.fast_track_flow:
    title: Reduce the path from intent to tracked work
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 2
    deps:
      - id: ts.ux_entry.tray_actions
    notes: Focus tracking can start from a free text intention or selected Work Item. First dogfood day exposed shortcut friction while typing, fixed by ignoring palette shortcuts inside editable fields. Guarded dogfood:continue reduces return friction after quitting Timeskein during an already started dogfood day without bypassing readiness checks.
    x:
      ops:
        attention_class: done
  ts.ux_entry.inventory_modes:
    title: Keep the multi-day Work Item list navigable
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.fast_track_flow
    notes: Added Recent, Today, Pinned, and All modes to the Work Item list. The default Recent mode keeps pinned, active, today, and recently touched items visible; typed search still reaches older matching items. Alt+1..4 switches modes without leaving the keyboard.
    x:
      ops:
        attention_class: done
  ts.ux_entry.resizable_today_split:
    title: Resize Today versus Work Item inventory
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.inventory_modes
    notes: Added a draggable divider above Work Item search to resize the Today list height, persisted in localStorage, with double-click reset to the default height.
    x:
      ops:
        attention_class: current

  ts.focus_core:
    title: Focus Session core
    kind: phase
    parent: ts
    status: done
    notes: "Accepted manual Session replacement baseline: a 25-minute focus target that continues counting real contact time until manual stop."
    x:
      ops:
        attention_class: current
  ts.focus_core.model_migrations:
    title: Add FocusSession persistence
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.ux_entry.fast_track_flow
    notes: FocusSession persistence is implemented. SessionEvent and pause accounting are intentionally deferred beyond the daily-control gate.
    x:
      ops:
        attention_class: current
  ts.focus_core.contracts_api:
    title: Add contracts and Local API for focus sessions
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.focus_core.model_migrations
    notes: Browser mock and macOS embedded agent should expose the same focus-session surface.
    x:
      ops:
        attention_class: current
  ts.focus_core.timer_ui:
    title: Build focus timer UI with overflow
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.focus_core.contracts_api
    notes: Shows elapsed contact time, 25-minute target, progress, and positive overflow after the target is reached.
    x:
      ops:
        attention_class: current
  ts.focus_core.session_lifecycle:
    title: Implement manual start and stop lifecycle
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.focus_core.timer_ui
    notes: Start, switch, stop, and active-session restore are implemented. Pause, resume, and cancel are deferred because they are not needed for the accepted Session replacement baseline.
    x:
      ops:
        attention_class: current
  ts.focus_core.restart_restore:
    title: Restore running focus session after app restart
    kind: task
    parent: ts.focus_core
    status: done
    effort: 2
    deps:
      - id: ts.focus_core.session_lifecycle
    notes: Avoid losing a running session when the Tauri shell or frontend reloads.
    x:
      ops:
        attention_class: current
  ts.focus_core.work_item_binding:
    title: Bind focus sessions to Work Items or free intentions
    kind: task
    parent: ts.focus_core
    status: done
    effort: 2
    deps:
      - id: ts.focus_core.contracts_api
    x:
      ops:
        attention_class: current
  ts.focus_core.session_notes:
    title: Capture a note at the end of a focus session
    kind: task
    parent: ts.focus_core
    status: done
    effort: 1
    deps:
      - id: ts.focus_core.session_lifecycle
    x:
      ops:
        attention_class: current
  ts.focus_core.dogfood_gate:
    title: First real Focus Session dogfood
    kind: milestone
    parent: ts.focus_core
    status: done
    milestone: true
    deps:
      - id: ts.focus_core.restart_restore
      - id: ts.focus_core.work_item_binding
      - id: ts.focus_core.session_notes
    notes: "First real dogfood day completed on 2026-07-01: 6:11:08 tracked focus, 20 entrances, useful gaps, Work Item totals, and app telemetry. The trial found real friction, but the core Session replacement loop produced usable day data."
    x:
      ops:
        attention_class: current

  ts.day_review:
    title: Day review and export
    kind: phase
    parent: ts
    status: done
    notes: Turn raw sessions and local app telemetry into the working-day picture needed for productivity analysis.
    x:
      ops:
        attention_class: done
  ts.day_review.timeline:
    title: Show focus blocks on a daily timeline
    kind: task
    parent: ts.day_review
    status: in_progress
    effort: 3
    deps:
      - id: ts.focus_core.dogfood_gate
    x:
      ops:
        attention_class: done
  ts.day_review.totals_gaps:
    title: Compute totals, gaps, and entry count
    kind: task
    parent: ts.day_review
    status: in_progress
    effort: 2
    deps:
      - id: ts.day_review.timeline
    notes: Track total tracked time, working occupancy, executive work, non-work tracked time, number of focus entrances, per-Work-Item totals, per-focus-block Activity Zone totals, gaps longer than 20 minutes, open gaps after the last stopped block, and target-reaching ratio.
    x:
      ops:
        attention_class: done
  ts.day_review.export:
    title: Export dogfood day data as Markdown
    kind: task
    parent: ts.day_review
    status: in_progress
    effort: 2
    deps:
      - id: ts.day_review.totals_gaps
    notes: Today can copy the raw day picture or a dogfood report with review prompts, and shows selected Markdown if clipboard access fails. UI and CLI reports are marked as draft when a focus session or Work Item is still active. SQLite fallback export, CLI dogfood report, and dogfood:finish end-of-day gate are implemented; finish refuses active focus sessions, stuck active Work Items, and empty days. dogfood:finish:save now saves both the readable day report and the RC-check evidence file. Reports include Total tracked, Working occupancy, Executive work, Non-work tracked, per-focus-block Activity Zone totals, Day Events, Work Item notes, Work Item Events, and Capture Activity for created, resolved, and converted captures. JSON/CSV export remains future work.
    x:
      ops:
        attention_class: done
  ts.day_review.work_item_events:
    title: Timestamped Work Item Events
    kind: task
    parent: ts.day_review
    status: done
    effort: 2
    deps:
      - id: ts.day_review.export
    notes: Work Item Events can be appended from the note editor or promoted from Capture Inbox, linked to the active focus session when applicable, listed through Local API, shown in the focus panel, edited/deleted for user-authored note_added events, and exported in UI/CLI Markdown reports. Generated system events remain internal history.
    x:
      ops:
        attention_class: done
  ts.day_review.day_events:
    title: Timestamped Day Events
    kind: task
