version: 3

nodes:
  ts:
    title: Timeskein
    kind: product
    status: in_progress
    notes: Local-first causal work memory and steering system. Nineteen real workdays accepted daily control, in-day structure, period reflection, semantic Tracks/Labels, evidence-backed stories, the causal spine, Operational Reality, and Operational Workspace. Day 19 clarified that Operational Reality is the derived foundation while the Working Contour is an optional user-authored contract view. The route now closes the manual working-memory gap through consumer-neutral Context Packs, promotes causal period review, teaches the inventory to clarify and prune incoming fragments, and only then probes untrusted automatic context behind privacy and deletion gates.
    x:
      ops:
        attention_class: overview
      strategy:
        horizon: north-star
        capability: product
        architecture_layer: all
        success_signal: The user can connect intention, action, change, evidence, decision, and next action across days and Tracks.
        privacy_class: mixed

  ts.causal_memory:
    title: Causal Work Memory
    kind: capability
    parent: ts
    status: in_progress
    notes: The shared causal spine is accepted. Working Memory Bridge is implemented and now awaits real 1/3/7-day re-entry acceptance before this capability advances to causal period review.
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Existing and new facts can explain what changed and what should happen next without inventing missing links.
        privacy_class: mixed
  ts.causal_memory.architecture_gate:
    title: Fix the causal model and truth boundaries
    kind: milestone
    parent: ts.causal_memory
    status: done
    milestone: true
    effort: 1
    deps:
      - id: ts.periodic_reflection.context_links
    notes: ADR-0004/0005, RFC-0009/0010, and Roadmap 0005 define user-authoritative state, untrusted observations, derived interpretations, ephemeral artifacts, consumer-neutral Context Packs, provenance, incremental migration, deletion intentions, and the bounded context probe.
    x:
      ops:
        attention_class: done
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: control
        success_signal: Canonical, derived, ephemeral, and control data have explicit boundaries.
        privacy_class: mixed
        dogfood_gate: documentation-and-opskarta-validation
  ts.causal_memory.provenance_contract:
    title: Add shared provenance and observation contracts
    kind: task
    parent: ts.causal_memory
    status: done
    effort: 3
    deps:
      - id: ts.causal_memory.architecture_gate
    notes: "Accepted for the manual causal slice: source/device, occurred/recorded time, schema version, confidence, correlation, and provenance are stored. Sensitivity and derivation metadata for machine observations belong to the future observation envelope, not to this completed gate."
    x:
      ops:
        attention_class: done
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Manual and machine-originated facts can be distinguished and traced.
        privacy_class: mixed
  ts.causal_memory.transition_history:
    title: Preserve manual state and next-action transitions
    kind: task
    parent: ts.causal_memory
    status: done
    effort: 3
    deps:
      - id: ts.causal_memory.architecture_gate
    notes: "Done for v1. Migration 012 stores append-only intent, state assertion, result, decision, next action, confirmation, and correction records. Corrections supersede rather than overwrite, and current tables/APIs remain the operational baseline."
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Operational Reality can explain when and why current state changed.
        privacy_class: ordinary
  ts.causal_memory.timeline_integrity:
    title: Keep focus time non-overlapping and auditable
    kind: task
    parent: ts.causal_memory
    status: done
    effort: 2
    deps:
      - id: ts.causal_memory.transition_history
    notes: "Accepted after the 2026-07-16 dogfood exposed a 9:05 overlap. Rust create/update rejects overlapping stopped intervals, touching boundaries remain valid, day closure and RC checks block on legacy overlaps, and period reports emit an explicit data-trust warning without silently rewriting history."
    x:
      ops:
        attention_class: done
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Tracked duration cannot be accepted while the underlying timeline double-counts time.
        privacy_class: ordinary
  ts.causal_memory.spine_gate:
    title: Causal work spine is queryable and historically honest
    kind: milestone
    parent: ts.causal_memory
    status: done
    milestone: true
    effort: 1
    deps:
      - id: ts.causal_memory.provenance_contract
      - id: ts.causal_memory.transition_history
      - id: ts.causal_memory.timeline_integrity
    notes: "Accepted 2026-07-16. Synthetic, migration/restart, historical as_of, semantic snapshots, evidence Ref, correction, Reflection follow-up, mock, packaged macOS, and period-report gates pass. Real 15–16 July use preserved a complete intent -> result with Ref -> next-action chain and exposed/fixed the timeline-overlap trust boundary."
    x:
      ops:
        attention_class: done
      strategy:
        horizon: now
        capability: causal-memory
        architecture_layer: canonical
        success_signal: A real Track history separates user facts, observations, inference, and unknowns.
        privacy_class: mixed
        dogfood_gate: real-track-causal-history

  ts.causal_memory.working_memory_bridge:
    title: Build a chronological working-memory bridge
    kind: epic
    parent: ts.causal_memory
    status: in_progress
    deps:
      - id: ts.causal_memory.spine_gate
      - id: ts.steering.workspace_gate
    notes: "Implemented on 2026-07-22 and hardened through 2026-08-08: chronological working memory, visible immutable revision/deletion history, materials, stages, daily outcomes, action -> change -> next-action capture, conflict-safe merge aliases, and exact_as_of work-item/track Context Packs in UI, Markdown, and JSON. A direct restart test proves that the re-entry state survives reopening the same SQLite database; Markdown canonical JSON equals the API pack; visual checks at 1280px and 720px found no overlap or horizontal overflow. Seven ordinary workdays from 2026-07-30 through 2026-08-07 produced 52:13:58 tracked and 104 entrances, including 12:18 on ППП, without new memory or re-entry; this is retained as a natural pre-D0 baseline. The soft gate reports four entries, one semantic entry, five stages, two transitions, an assigned Track, and 11 daily-outcome snapshots, but no material, revision, complete causal stop trace, or re-entry. D0 has not started; its memory and material must be recorded before the qualifying focus block. Automated gates are green; the epic stays in progress until one real long-lived Work Item passes distinct 1/3/7-day returns without an external notebook."
    x:
      ops:
        attention_class: now
      strategy:
        horizon: next
        capability: causal-memory
        architecture_layer: canonical
        success_signal: Long focus blocks leave enough structured change evidence to resume and review without an external notebook.
        privacy_class: mixed
  ts.causal_memory.working_memory_stream:
    title: Keep one chronological thought and material stream
    kind: task
    parent: ts.causal_memory.working_memory_bridge
    status: done
    effort: 4
    deps:
      - id: ts.steering.workspace_gate
    notes: "Done 2026-07-22. The selected Work Item has one chronological stream for thoughts, questions, decisions, observations, results, next actions, materials, revisions, and tombstones. Capture remains available without active focus and preserves provenance and semantic snapshots."
    x:
      ops:
        attention_class: done
      strategy:
        horizon: next
        capability: causal-memory
        architecture_layer: canonical
        success_signal: The user no longer needs an external scratchpad to see the reasoning and materials of one long work stream.
        privacy_class: mixed
  ts.causal_memory.context_pack_v1:
    title: Build consumer-neutral re-entry Context Packs
    kind: task
    parent: ts.causal_memory.working_memory_bridge
    status: done
    effort: 3
    deps:
      - id: ts.causal_memory.working_memory_stream
    notes: "Done 2026-07-22, hardened 2026-07-24. Versioned work-item-reentry and track-reentry profiles project manual facts, materials, decisions, unknowns, refs, stages, changed state, and next actions into the same deterministic UI, Markdown, and JSON semantics. Markdown embeds the canonical JSON and tests assert exact equality with the API pack; the UI previews that same Markdown. The ordinary day export now also groups immutable focus snapshots by stage and daily outcome, with mixed unclassified blocks visible as Без этапа and a legacy-schema fallback. Build/export events are auditable and provider-neutral."
    x:
      ops:
        attention_class: done
      strategy:
        horizon: next
        capability: causal-memory
        architecture_layer: derived
        success_signal: One re-entry package restores a long work stream for the user and remains portable across consumers.
        privacy_class: mixed
  ts.causal_memory.working_memory_gate:
    title: Working memory supports multi-day re-entry
    kind: milestone
    parent: ts.causal_memory.working_memory_bridge
    status: in_progress
    milestone: true
    effort: 1
    deps:
      - id: ts.causal_memory.working_memory_stream
      - id: ts.causal_memory.context_pack_v1
      - id: ts.in_day_structure.rich_note_review
      - id: ts.in_day_structure.work_item_stages
      - id: ts.in_day_structure.visible_causality
    notes: "Automated implementation gate is ready and reports the explicit pre_d0 -> d0 -> d1 -> d4 -> d11 state. A caller-supplied date range cannot manufacture elapsed acceptance time, and re-entry evidence is counted only after a complete baseline and in chronological 1-, 3-, and 7-day order. D0 requires active same-day memory and material recorded before the qualifying focus starts, plus its stage, daily outcome, real focus work, and causal stop evidence; context added after the block or later deleted cannot backdate or satisfy the baseline. Each return is linked to the exact Focus Session created by a successful `Начать отсюда` action and must end with its own result -> state change -> next action chain; a failed, already-active, or neighboring manual start does not count. Final Work Item/Track Context Packs and all Markdown/JSON exports must be produced after the last accepted return. Accept only after the same real long-running direction is resumed from its Timeskein trace without reconstruction in an external notebook."
    x:
      ops:
        attention_class: now
      strategy:
        horizon: next
        capability: causal-memory
        architecture_layer: control
        success_signal: A multi-day return recovers reasoning, materials, changed state, and next action from Timeskein alone.
        privacy_class: mixed
        dogfood_gate: multi-day-working-memory

  ts.steering:
    title: Current-State Steering
    kind: capability
    parent: ts
    status: in_progress
    notes: Turn causal history into a live, correctable answer about what is active, waiting, blocked, parked, reactive, stale-important, completed, or still an unresolved tail.
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: derived
        success_signal: Opening Timeskein is enough to choose a justified next action without external archaeology.
        privacy_class: mixed
  ts.steering.manual_correction:
    title: Confirm and correct operational state
    kind: task
    parent: ts.steering
    status: done
    effort: 3
    deps:
      - id: ts.periodic_reflection.operational_reality
    notes: "Implemented in the Operational Reality panel and Local API. The user can confirm or explain a correction, close, wait, block, park, mark reactive/meeting-tail/stale, dismiss or complete a next action, and the causal record preserves the prior assertion."
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: control
        success_signal: A machine suggestion never silently replaces user state.
        privacy_class: ordinary
  ts.steering.operational_reality_gate:
    title: Operational Reality selects the next justified action
    kind: milestone
    parent: ts.steering
    status: done
    milestone: true
    effort: 1
    deps:
      - id: ts.periodic_reflection.operational_reality
      - id: ts.steering.manual_correction
    notes: "Accepted 2026-07-16. The strict 15–16 July gate passed with 2/2 real days, 11/3 starts through `Начать отсюда`, meeting-tail/stale-important/waiting/reactive states, one correction surviving restart, three Reflection follow-ups, one full intent -> result with Ref -> next-action chain, and 2/2 normal closures."
    x:
      ops:
        attention_class: done
      strategy:
        horizon: now
        capability: steering
        architecture_layer: derived
        success_signal: The next action is selected without rebuilding the current work inventory elsewhere.
        privacy_class: mixed
        dogfood_gate: real-day-operational-reality

  ts.steering.workspace_convergence:
    title: Converge Operational Reality, day contract, and inventory
    kind: epic
    parent: ts.steering
    status: in_progress
    deps:
      - id: ts.steering.operational_reality_gate
    notes: "Accepted 2026-07-22. The strict gate passed with 4/3 contract/start/closure days, 3/2 re-entry days, 1/1 revised day, intact history, and no unresolved errors or overlaps. The final day preserved six versions and work started from revised contracts without an external active-list. Day 19 corrected an over-convergence regression: the single workspace now exposes derived Рабочая реальность and optional contract-backed Рабочий контур as distinct views. Follow-up needs are Operational Reality context while composing, cancelable accidental closure, and explainable signals that the contour needs review."
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: derived
        success_signal: The user can form and follow the day contract without maintaining three competing representations of current work.
        privacy_class: ordinary
  ts.steering.workspace_day_contract:
    title: Build a visible item-backed day contract
    kind: task
    parent: ts.steering.workspace_convergence
    status: done
    effort: 3
    deps:
      - id: ts.steering.operational_reality_gate
    notes: Migration 013, Rust API, shared contracts, browser mock, UI, reports, export, telemetry, and tests implement a visible 2–3-subject contract with first action, parking, why-now, and append-only revisions.
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: canonical
        success_signal: The active set survives the first start and remains the reference point for later choices.
        privacy_class: ordinary
  ts.steering.workspace_primary_surface:
    title: Make one primary operational surface
    kind: task
    parent: ts.steering.workspace_convergence
    status: done
    effort: 4
    deps:
      - id: ts.steering.workspace_day_contract
    notes: One Operational Workspace now has two explicit views. Рабочая реальность remains the full derived and correctable projection even without a day contract; Рабочий контур is the optional contract lens with active set, first action, parking and history. Observable drift can call attention back to the contour. Inventory remains a secondary search and maintenance surface.
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: derived
        success_signal: The primary screen keeps Reality and Contour semantically distinct without making the user reconcile competing stores before acting.
        privacy_class: ordinary
  ts.steering.workspace_reentry:
    title: Use the same loop for morning entry and re-entry
    kind: task
    parent: ts.steering.workspace_convergence
    status: done
    effort: 3
    deps:
      - id: ts.steering.workspace_day_contract
    notes: Morning, adjustment, and re-entry code paths reuse or append the same contract and emit dedicated telemetry. Real re-entry passed on 2026-07-20 and 2026-07-21 (`2/2`). Persisting a changed revision remains the only workspace-gate criterion.
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: control
        success_signal: A return after interruption reaches a justified next action without rebuilding the work set elsewhere.
        privacy_class: ordinary
  ts.steering.workspace_explainability:
    title: Make workspace actions and review checks self-explanatory
    kind: task
    parent: ts.steering.workspace_convergence
    status: done
    effort: 2
    deps:
      - id: ts.steering.workspace_primary_surface
    notes: Action labels state start, return, revision, maintenance, and history effects in place. The accepted four-day protocol, browser checks, structural smoke coverage, and real revision history prove the interface boundary.
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: presentation
        success_signal: The user can complete entry, correction, and day review without consulting an external instruction sheet.
        privacy_class: ordinary
  ts.steering.workspace_gate:
    title: One operational workspace drives the real day
    kind: milestone
    parent: ts.steering.workspace_convergence
    status: done
    milestone: true
    effort: 1
    deps:
      - id: ts.steering.workspace_primary_surface
      - id: ts.steering.workspace_reentry
      - id: ts.steering.workspace_explainability
    notes: Accepted 2026-07-22. The strict gate passed with 4/3 contract/start/closure days, 3/2 re-entry days, 1/1 revised day, intact chains, and no unresolved errors, overlaps, or legacy dispatch starts. Manual verdicts confirm no external active-list and useful return through the same workspace.
    x:
      ops:
        attention_class: now
      strategy:
        horizon: now
        capability: steering
        architecture_layer: control
        success_signal: Current focus, grounds, parking, state change, and next action are understandable in one workspace across a real day.
        privacy_class: ordinary
        dogfood_gate: operational-workspace-real-days
  ts.steering.adaptive_surface_architecture:
    title: Split the dense workspace into role-based adaptive surfaces
    kind: epic
    parent: ts.steering
    status: planned
    effort: 8
    deps:
      - id: ts.steering.workspace_gate
      - id: ts.causal_memory.working_memory_gate
    notes: "Day 18 confirmed that the full desktop workspace is useful but needs a large screen. Define separate Now/Capture, Day, Work/Memory, Review, and Settings/Continuity surfaces before mobile work; compact and mobile clients must not be scaled copies of the entire desktop canvas."
    x:
      ops:
        attention_class: later
      strategy:
        horizon: next-later
        capability: steering
        architecture_layer: presentation
        assumption: Role-based navigation can preserve power while lowering orientation cost on compact screens.
        success_signal: Core start, capture, re-entry, memory, and review flows remain usable at compact desktop and mobile widths without hiding canonical facts.
        privacy_class: ordinary

  ts.trust:
    title: Trust, Privacy, and Retention
    kind: capability
    parent: ts
    status: planned
    notes: Cross-cutting control plane for source permissions, sensitivity, pause, purge, revocation, redaction, TTL, storage budget, and audit.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: now-next
        capability: trust
        architecture_layer: control
        success_signal: Every collected datum has an understandable policy and a reliable deletion path.
        privacy_class: high
  ts.trust.minimum_policy_gate:
    title: Define minimum policy controls for a context probe
    kind: milestone
    parent: ts.trust
    status: planned
    milestone: true
    effort: 2
    deps:
      - id: ts.trust.untrusted_content_boundary
    notes: Before automatic observation, implement encryption at rest with a system-held key, a visible indicator, pause, local-only storage by default, sensitivity, TTL, separate purge-raw/forget-completely/revoke-source paths, cascading derived cleanup, processing-location disclosure, and audit for the bounded source.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: trust
        architecture_layer: control
        success_signal: The bounded probe can be stopped, raw-purged, completely forgotten, or revoked without hidden residue or a newly created summary.
        privacy_class: high
        dogfood_gate: privacy-control-smoke
  ts.trust.untrusted_content_boundary:
    title: Enforce untrusted-content and derivation boundaries
    kind: task
    parent: ts.trust
    status: planned
    effort: 2
    deps:
      - id: ts.causal_memory.architecture_gate
    notes: Treat external text, OCR, imported assistant memory, and model output as untrusted data. Extraction is tool-less and schema-bound; derivations retain input, provider, model, prompt, schema, processing-location, and invalidation provenance; only explicit user acceptance may create a causal claim.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
        capability: trust
        architecture_layer: control
        success_signal: Source content cannot become an instruction or silently mutate user-authoritative state.
        privacy_class: high

  ts.stewardship:
    title: Inventory Stewardship and Inbound Clarification
    kind: capability
    parent: ts
    status: planned
    notes: Give significant incoming fragments an explicit fate and keep causal memory finite, understandable, and trustworthy before automatic sources increase the volume.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: stewardship
        architecture_layer: control
        success_signal: Captures, unknowns, stale tails, duplicates, and items without next actions are deliberately resolved instead of silently accumulating.
        privacy_class: mixed
  ts.stewardship.clarification_loop:
    title: Give incoming fragments an explicit fate
    kind: epic
    parent: ts.stewardship
    status: planned
    effort: 5
    deps:
      - id: ts.causal_memory.working_memory_gate
      - id: ts.periodic_reflection.causal_period_story
    notes: Build one review queue for captures, Unclassified or unknown records, stale tails, probable duplicates, and Work Items without next actions. Outcomes are continue, link, delegate, wait, defer, reference, merge, archive, or delete, with preserved provenance and an optional revisit time.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: stewardship
        architecture_layer: control
        success_signal: Every reviewed fragment has a visible destination, reason, and return condition instead of remaining ambient WIP.
        privacy_class: mixed
  ts.stewardship.inventory_review:
    title: Review and prune stale inventory
    kind: task
    parent: ts.stewardship
    status: planned
    effort: 3
    deps:
      - id: ts.stewardship.clarification_loop
    notes: Support a regular real inventory review with visible unresolved counts, duplicate merging, archival, deliberate deletion, and evidence that useful memory remains recoverable.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: stewardship
        architecture_layer: derived
        success_signal: Inventory size and unresolved tails remain understandable without an external grooming list.
        privacy_class: mixed
  ts.stewardship.gate:
    title: Clarification keeps inventory trusted and finite
    kind: milestone
    parent: ts.stewardship
    status: planned
    milestone: true
    effort: 1
    deps:
      - id: ts.stewardship.inventory_review
    notes: Accept only after a real weekly review assigns explicit outcomes to representative incoming fragments, leaves the remaining unknown queue visible, and proves merge, archive, and delete paths without losing provenance.
    x:
      ops:
        attention_class: next
      strategy:
        horizon: next
        capability: stewardship
        architecture_layer: control
        success_signal: The user no longer needs an external list to remember where incoming fragments went or what still needs clarification.
        privacy_class: mixed
        dogfood_gate: inventory-stewardship-real-review

  ts.context_fabric:
    title: Context Fabric
    kind: capability
    parent: ts
    status: planned
    notes: After manual working memory, causal review, and inventory stewardship are accepted, validate automatic context through a bounded focus-scoped probe and generalize only proven value into SourceNodes and explicit connectors.
    x:
      ops:
        attention_class: later
      strategy:
        horizon: later
