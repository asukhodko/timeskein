version: 3

nodes:
  ts:
    title: Timeskein
    kind: product
    status: in_progress
    notes: Manual-first, local-first work inventory. The macOS Session replacement baseline and daily-control closure gate are accepted; current work is the in-day structure layer before arbitrary-period reflection reports.
    x:
      ops:
        attention_class: overview

  ts.baseline:
    title: Recovery baseline
    kind: phase
    parent: ts
    status: done
    notes: Browser dev mode and macOS app are usable; the Rust agent is embedded in the Tauri app.
    x:
      ops:
        attention_class: done
  ts.baseline.browser_dev:
    title: Browser development mode with mock API
    kind: task
    parent: ts.baseline
    status: done
    effort: 2
    x:
      ops:
        attention_class: done
  ts.baseline.macos_app:
    title: macOS app with embedded Rust agent
    kind: task
    parent: ts.baseline
    status: done
    effort: 4
    deps:
      - id: ts.baseline.browser_dev
    x:
      ops:
        attention_class: done
  ts.baseline.docs:
    title: Current implementation documentation
    kind: task
    parent: ts.baseline
    status: done
    effort: 1
    deps:
      - id: ts.baseline.macos_app
    x:
      ops:
        attention_class: done

  ts.ux_entry:
    title: App entry UX
    kind: phase
    parent: ts
    status: in_progress
    notes: Make opening, moving, hiding, and using the app feel like a fast time-tracking tool rather than a static palette.
    x:
      ops:
        attention_class: done
  ts.ux_entry.window_drag:
    title: Make the app window movable
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.baseline.macos_app
    notes: Header drag uses Tauri startDragging, with buttons excluded from the drag region.
    x:
      ops:
        attention_class: done
  ts.ux_entry.hide_toggle:
    title: Add clear hide and show behavior
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.window_drag
    notes: A shown window must be easy to dismiss without quitting the whole app.
    x:
      ops:
        attention_class: done
  ts.ux_entry.tray_actions:
    title: Wire tray menu actions
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.hide_toggle
    notes: Left-click and Show/Hide toggle the window. The window no longer uses always-on-top or task-switcher hiding, macOS Reopen restores a hidden window, the native shell keeps the menu bar title updated from the local API, show/hide requests are logged for window entrypoints, and dogfood:continue reopens an already started dogfood day through the same guarded app-opening path.
    x:
      ops:
        attention_class: current
  ts.ux_entry.monitor_policy:
    title: Document macOS multi-monitor status item limits
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.tray_actions
    notes: Documented that Timeskein creates one macOS status item and macOS controls which menu bar displays it; reliable alternate entrypoints are Show/Hide, global shortcut, and normal app switching.
    x:
      ops:
        attention_class: current
  ts.ux_entry.fast_track_flow:
    title: Reduce the path from intent to tracked work
    kind: task
    parent: ts.ux_entry
    status: in_progress
    effort: 2
    deps:
      - id: ts.ux_entry.tray_actions
    notes: Focus tracking can start from a free text intention or selected Work Item. First dogfood day exposed shortcut friction while typing, fixed by ignoring palette shortcuts inside editable fields. Guarded dogfood:continue reduces return friction after quitting Timeskein during an already started dogfood day without bypassing readiness checks.
    x:
      ops:
        attention_class: done
  ts.ux_entry.inventory_modes:
    title: Keep the multi-day Work Item list navigable
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.fast_track_flow
    notes: Added Recent, Today, Pinned, and All modes to the Work Item list. The default Recent mode keeps pinned, active, today, and recently touched items visible; typed search still reaches older matching items. Alt+1..4 switches modes without leaving the keyboard.
    x:
      ops:
        attention_class: current
  ts.ux_entry.resizable_today_split:
    title: Resize Today versus Work Item inventory
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.inventory_modes
    notes: Added a draggable divider above Work Item search to resize the Today list height, persisted in localStorage, with double-click reset to the default height.
    x:
      ops:
        attention_class: current

  ts.focus_core:
    title: Focus Session core
    kind: phase
    parent: ts
    status: done
    notes: "Accepted manual Session replacement baseline: a 25-minute focus target that continues counting real contact time until manual stop."
    x:
      ops:
        attention_class: current
  ts.focus_core.model_migrations:
    title: Add FocusSession persistence
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.ux_entry.fast_track_flow
    notes: FocusSession persistence is implemented. SessionEvent and pause accounting are intentionally deferred beyond the daily-control gate.
    x:
      ops:
        attention_class: current
  ts.focus_core.contracts_api:
    title: Add contracts and Local API for focus sessions
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.focus_core.model_migrations
    notes: Browser mock and macOS embedded agent should expose the same focus-session surface.
    x:
      ops:
        attention_class: current
  ts.focus_core.timer_ui:
    title: Build focus timer UI with overflow
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.focus_core.contracts_api
    notes: Shows elapsed contact time, 25-minute target, progress, and positive overflow after the target is reached.
    x:
      ops:
        attention_class: current
  ts.focus_core.session_lifecycle:
    title: Implement manual start and stop lifecycle
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.focus_core.timer_ui
    notes: Start, switch, stop, and active-session restore are implemented. Pause, resume, and cancel are deferred because they are not needed for the accepted Session replacement baseline.
    x:
      ops:
        attention_class: current
  ts.focus_core.restart_restore:
    title: Restore running focus session after app restart
    kind: task
    parent: ts.focus_core
    status: done
    effort: 2
    deps:
      - id: ts.focus_core.session_lifecycle
    notes: Avoid losing a running session when the Tauri shell or frontend reloads.
    x:
      ops:
        attention_class: current
  ts.focus_core.work_item_binding:
    title: Bind focus sessions to Work Items or free intentions
    kind: task
    parent: ts.focus_core
    status: done
    effort: 2
    deps:
      - id: ts.focus_core.contracts_api
    x:
      ops:
        attention_class: current
  ts.focus_core.session_notes:
    title: Capture a note at the end of a focus session
    kind: task
    parent: ts.focus_core
    status: done
    effort: 1
    deps:
      - id: ts.focus_core.session_lifecycle
    x:
      ops:
        attention_class: current
  ts.focus_core.dogfood_gate:
    title: First real Focus Session dogfood
    kind: milestone
    parent: ts.focus_core
    status: done
    milestone: true
    deps:
      - id: ts.focus_core.restart_restore
      - id: ts.focus_core.work_item_binding
      - id: ts.focus_core.session_notes
    notes: "First real dogfood day completed on 2026-07-01: 6:11:08 tracked focus, 20 entrances, useful gaps, Work Item totals, and app telemetry. The trial found real friction, but the core Session replacement loop produced usable day data."
    x:
      ops:
        attention_class: current

  ts.day_review:
    title: Day review and export
    kind: phase
    parent: ts
    status: in_progress
    notes: Turn raw sessions and local app telemetry into the working-day picture needed for productivity analysis.
    x:
      ops:
        attention_class: done
  ts.day_review.timeline:
    title: Show focus blocks on a daily timeline
    kind: task
    parent: ts.day_review
    status: in_progress
    effort: 3
    deps:
      - id: ts.focus_core.dogfood_gate
    x:
      ops:
        attention_class: done
  ts.day_review.totals_gaps:
    title: Compute totals, gaps, and entry count
    kind: task
    parent: ts.day_review
    status: in_progress
    effort: 2
    deps:
      - id: ts.day_review.timeline
    notes: Track total tracked time, working occupancy, executive work, non-work tracked time, number of focus entrances, per-Work-Item totals, per-focus-block Activity Zone totals, gaps longer than 20 minutes, open gaps after the last stopped block, and target-reaching ratio.
    x:
      ops:
        attention_class: done
  ts.day_review.export:
    title: Export dogfood day data as Markdown
    kind: task
    parent: ts.day_review
    status: in_progress
    effort: 2
    deps:
      - id: ts.day_review.totals_gaps
    notes: Today can copy the raw day picture or a dogfood report with review prompts, and shows selected Markdown if clipboard access fails. UI and CLI reports are marked as draft when a focus session or Work Item is still active. SQLite fallback export, CLI dogfood report, and dogfood:finish end-of-day gate are implemented; finish refuses active focus sessions, stuck active Work Items, and empty days. dogfood:finish:save now saves both the readable day report and the RC-check evidence file. Reports include Total tracked, Working occupancy, Executive work, Non-work tracked, per-focus-block Activity Zone totals, Day Events, Work Item notes, Work Item Events, and Capture Activity for created, resolved, and converted captures. JSON/CSV export remains future work.
    x:
      ops:
        attention_class: done
  ts.day_review.work_item_events:
    title: Timestamped Work Item Events
    kind: task
    parent: ts.day_review
    status: done
    effort: 2
    deps:
      - id: ts.day_review.export
    notes: Work Item Events can be appended from the note editor or promoted from Capture Inbox, linked to the active focus session when applicable, listed through Local API, shown in the focus panel, edited/deleted for user-authored note_added events, and exported in UI/CLI Markdown reports. Generated system events remain internal history.
    x:
      ops:
        attention_class: current
  ts.day_review.day_events:
    title: Timestamped Day Events
    kind: task
    parent: ts.day_review
    status: done
    effort: 1
    deps:
      - id: ts.day_review.work_item_events
    notes: Day Events can be appended from the focus panel for buffers, recovery notes, tracking corrections, and day-level review context. They can be listed, edited, re-zoned, deleted, linked to the active focus session, assigned an Activity Zone, exported in UI/CLI Markdown reports, and counted by the RC evidence checker. Significant gaps and the current open gap have Explain shortcuts that prepare a re-zonable Day Event with the gap range and duration.
    x:
      ops:
        attention_class: current
  ts.day_review.corrections:
    title: Post-factum focus correction
    kind: task
    parent: ts.day_review
    status: done
    effort: 3
    deps:
      - id: ts.day_review.export
    notes: Stopped focus blocks can be added after the fact, edited, reassigned to a Work Item by title, re-zoned, split at a timestamp, and corrected through the Today list. The add-missed-block path creates a stopped session without starting an active timer. New focus blocks snapshot their Work Item Activity Zone, and later Work Item zone changes do not rewrite old sessions. Work Item title/type/Activity Zone/note editing is implemented with duplicate-title protection. Markdown reports use the corrected SQLite rows, so evening review can fix tracking mistakes before copying the final day picture.
    x:
      ops:
        attention_class: current
  ts.day_review.app_telemetry:
    title: Add local app-event telemetry for dogfood analysis
    kind: task
    parent: ts.day_review
    status: done
    effort: 2
    deps:
      - id: ts.day_review.export
    notes: SQLite app_events, Local API, UI/agent/script logging, metrics export, dogfood report section, and smoke coverage are implemented. Capture Inbox create/resolve/convert actions, post-factum focus corrections, accepted correction-review decisions, and window show/hide requests are included in telemetry, including failure counters. Payloads must stay technical and must not store raw titles, notes, URLs, or typed text.
    x:
      ops:
        attention_class: current
  ts.day_review.review_checklist:
    title: Show automatic evening review checklist
    kind: task
    parent: ts.day_review
    status: done
    effort: 1
    deps:
      - id: ts.day_review.export
      - id: ts.day_review.work_item_events
      - id: ts.day_review.day_events
    notes: Today and dogfood reports show a Review Checklist for active-state blockers, open captures, significant gaps, open gaps, Activity Zone coverage, non-work tracking, capture coverage, Day Events, Work Item context coverage, entry paths, window entrypoints, and focus-correction evidence. Gap items can stage a Day Event through `Объяснить` or quick templates `Управляемость` and `Восстановление`. Missing day/item context can stage a short context note through `Добавить контекст` or be explicitly accepted as `Контекст не нужен` when the report is already understandable. Optional Activity Zone, Capture usage, context coverage, entry path, window-entrypoint, Work Item badge, tracking-accuracy, and open-capture follow-up checks can be explicitly accepted as review telemetry. The checklist is meant to make evening cleanup explicit before copying the final report.
    x:
      ops:
        attention_class: current
  ts.day_review.analysis_gate:
    title: End-of-day analysis can use Timeskein data
    kind: milestone
    parent: ts.day_review
    status: done
    milestone: true
    deps:
      - id: ts.day_review.app_telemetry
      - id: ts.day_review.review_checklist
    notes: The UI/CLI dogfood report and RC evidence check summarize focus totals, Activity Zones, Day Events, Work Item notes/events, Capture Inbox coverage, accepted review decisions, window telemetry including show/hide request counts, and product-friction counters. They include a Daily Control Goal Audit table. dogfood:goal-check requires saved evidence and explicit --no-codex-guidance confirmation for the real local database, then runs pnpm test, dogfood:preflight, and strict RC evidence on the same code, so the next dogfood day can be judged requirement by requirement against report usefulness rather than memory reconstruction.
    x:
      ops:
        attention_class: current

  ts.capture:
    title: Capture Inbox
    kind: phase
    parent: ts
    status: done
    notes: Let incoming events be captured without interrupting the current focus block, then processed later into resolution, note, or Work Item. Minimal create/list/resolve/convert baseline is implemented and was proven during the 2026-07-03 dogfood day.
    x:
      ops:
        attention_class: current
  ts.capture.model_api:
    title: Add captured-event model and Local API
    kind: task
    parent: ts.capture
    status: done
    effort: 3
    deps:
      - id: ts.day_review.analysis_gate
    notes: "Implemented SQLite captures table and Local API capture.create/list/resolve/convert_to_work_item. Captures store timestamp, text, optional focus-session link, optional Work Item link, and state: open, resolved, converted."
    x:
      ops:
        attention_class: current
  ts.capture.quick_ui:
    title: Add fast capture control
    kind: task
    parent: ts.capture
    status: done
    effort: 3
    deps:
      - id: ts.capture.model_api
    notes: "Implemented one small Capture input in the focus panel. Creating a capture is safe while a timer is running and does not create timed work."
    x:
      ops:
        attention_class: current
  ts.capture.review_flow:
    title: Review and promote captured events
    kind: task
    parent: ts.capture
    status: done
    effort: 3
    deps:
      - id: ts.capture.quick_ui
    notes: Open captures can be edited, deleted, resolved, converted to a Work Item, or appended as timestamped Work Item Events. Dogfood reports show all captures created during the selected day, including resolved and converted items, and promoted captures also appear in Work Item Events. The 2026-07-03 dogfood day created four captures during active focus, with two resolved, one converted, one intentionally left visible as follow-up, and zero capture failures. A fuller capture history view remains future work.
    x:
      ops:
        attention_class: current

  ts.hardening:
    title: Dogfood hardening
    kind: phase
    parent: ts
    status: in_progress
    notes: Stabilize the first useful product slice without broadening scope to Evidence Mode or sync.
    x:
      ops:
        attention_class: done
  ts.hardening.smoke:
    title: Add smoke checks for focus-session flows
    kind: task
    parent: ts.hardening
    status: in_progress
    effort: 2
    deps:
      - id: ts.day_review.analysis_gate
    notes: "pnpm test now covers contracts build, TypeScript typecheck, Rust agent integration tests with temporary SQLite, mock-store unit tests, Work Item list mode tests, mock API smoke, Day Events API smoke, and key SQLite/report smoke. dogfood:preflight adds script syntax checks, Work Item list mode tests, packaged macOS build, embedded-agent smoke, focus switching, post-factum correction API, Work Item editing, capture API, Day Events API, Capture Inbox telemetry, stale lock/port recovery, app_events constraint migration, restart/restore, and dogfood start/continue/status/ready/rc-check/reset/stop-active/open-app smoke. Export and RC-check smokes now include legacy focus-session schemas without Activity Zone columns. Browser UI smoke is still manual."
    x:
      ops:
        attention_class: done
  ts.hardening.post_dogfood_friction:
    title: Fix first dogfood friction
    kind: task
    parent: ts.hardening
    status: in_progress
    effort: 2
    deps:
      - id: ts.focus_core.dogfood_gate
    notes: Fixed typing C/С opening Create, creating a new active Work Item, ambiguous last-seen timestamps, and added the first Capture Inbox baseline. Post-baseline work added Work Item title/basic-field editing, focus-block correction including add-missed-block, per-block Activity Zone snapshots/overrides, Work Item day/total time, Work Item list modes for accumulated multi-day inventories, a resizable Today/Work Item split, timestamped Day Events with explicit zones and gap/open-gap Explain shortcuts, timestamped Work Item Events, capture-to-event promotion, capture edit/delete for open items, Command+Tab/Dock restore, non-always-on-top window policy, native menu-bar status refresh, show/hide request telemetry, guarded dogfood:continue for reopening an existing day, separate Total tracked / Working occupancy / Executive work / Non-work tracked report totals, and a live Activity Zone dashboard. Remaining friction is mostly richer correction/review UI.
    x:
      ops:
        attention_class: done
  ts.hardening.backup_reset:
    title: Add local data backup and reset path
    kind: task
    parent: ts.hardening
    status: done
    effort: 2
    deps:
      - id: ts.day_review.analysis_gate
    notes: dogfood:reset-db dry-runs by default, moves timeskein.db plus SQLite sidecar files to timestamped backup names only after explicit --apply, and refuses while the embedded agent or app process is alive unless --force is passed. dogfood:ready prints a manual backup command for the main DB file and shows running app PIDs.
    x:
      ops:
        attention_class: current
  ts.hardening.package_app:
    title: Rebuild macOS app for regular personal use
    kind: task
    parent: ts.hardening
    status: done
    effort: 1
    deps:
      - id: ts.hardening.smoke
    x:
      ops:
        attention_class: current
  ts.hardening.release_notes:
    title: Write dogfood release notes and known limitations
    kind: task
    parent: ts.hardening
    status: done
    effort: 1
    deps:
      - id: ts.hardening.package_app
      - id: ts.hardening.backup_reset
    notes: "Dogfood Release Candidate doc defines the pass/fail gate. Dogfood Release Baseline records the accepted 2026-07-03 verdict and known limitations. Since acceptance, post-factum focus correction including add-missed-block, per-block Activity Zone correction, Work Item title/type/Activity Zone editing, separate Total tracked / Working occupancy / Executive work / Non-work tracked report totals, live Activity Zone dashboard, Activity Zone report totals, day/total Work Item time, timestamped Day Events, timestamped Work Item Events with user-authored event edit/delete, capture-to-event promotion, capture edit/delete for open items, window restore, native menu bar counter refresh, and show/hide request telemetry are implemented. Remaining limitations include richer correction/review UI."
    x:
      ops:
        attention_class: current
  ts.hardening.dogfood_release:
    title: Session replacement dogfood baseline
    kind: milestone
    parent: ts.hardening
    status: done
    milestone: true
    deps:
      - id: ts.hardening.release_notes
    notes: Accepted on 2026-07-03. Three dogfood days proved the macOS manual tracking baseline; the third day used Capture Inbox during active focus four times and had zero API/copy/capture/start-stop failures, zero duplicate titles, and no active-state split brain. Remaining limitations are documented and moved to post-baseline work.
    x:
      ops:
        attention_class: current

  ts.daily_control:
    title: Daily Control Dogfood Gate
    kind: phase
    parent: ts
    status: done
    notes: "Closed on 2026-07-08. The 2026-07-06 and 2026-07-07 post-baseline days proved useful daily-control data. The 2026-07-08 day then proved the missing gate: final measured evening closure took 2:32, saved evidence was final, and strict `pnpm dogfood:goal-check -- --date 2026-07-08 --no-codex-guidance` passed after running the full test/preflight/RC path."
    x:
      ops:
        attention_class: done
  ts.daily_control.real_day:
    title: Run post-baseline daily-control dogfood day
    kind: task
    parent: ts.daily_control
    status: done
    effort: 1
    deps:
      - id: ts.hardening.dogfood_release
    notes: Completed across 2026-07-06, 2026-07-07, and 2026-07-08. The days proved focus blocks, Activity Zones, Day/Work Item Events, Capture Inbox conversion, Work Item time evidence, typed and selected/list entry paths, window-entry telemetry, and useful real-day reports. Later in-day-structure work added separate dispatch-ritual entry telemetry for the next dogfood gate. The final 2026-07-08 daily-control day added a measured closure under 10 minutes.
    x:
      ops:
        attention_class: done
  ts.daily_control.goal_check:
    title: Close daily-control goal with strict evidence
    kind: milestone
    parent: ts.daily_control
    status: done
    milestone: true
    effort: 1
    deps:
      - id: ts.daily_control.real_day
    notes: "Done on 2026-07-08. The saved report was final, had no active focus or active Work Item, closure duration was 2:32, the user did not need Codex to navigate the panel, and strict `pnpm dogfood:goal-check -- --date 2026-07-08 --no-codex-guidance` passed. This closes the cheap day-closure goal and frees the next product layer: in-day structure and self-coordination."
    x:
      ops:
        attention_class: done

  ts.in_day_structure:
    title: In-day structure and self-coordination
    kind: phase
    parent: ts
    status: in_progress
    notes: "Current product layer after the 2026-07-08 closure gate. Turn Timeskein from a timer plus evening report into a day-structuring tool. Dogfood days 2026-07-07 and 2026-07-08 showed that work becomes easier after one focus is selected, while the expensive part is rebuilding manageability after breaks and choosing one legitimate next action without external pressure. The first slices added live Activity Zone totals with explicit in-day glance evidence, separated working occupancy from executive work, added a cheap active-focus journal, classified explained gaps by exact interval, added a compact day-entry/post-break dispatch ritual, and made dispatch-ritual starts visible in dogfood telemetry and closure checks. The remaining layer should prove a day without a parallel Codex note and decide whether Work Item stages are still necessary."
    x:
      ops:
        attention_class: current
  ts.in_day_structure.active_work_journal:
    title: Stream thoughts inside active work
    kind: task
    parent: ts.in_day_structure
    status: done
    effort: 3
    deps:
      - id: ts.daily_control.goal_check
    notes: "Done as a first slice on 2026-07-08. The active focus panel now has a journal input with event kind selector and target selector. It defaults to the current Work Item, can write day-level context, preserves a local draft until successful save, and appends into existing Work Item Events or Day Events without stopping the timer. Event kind is currently stored as a Russian text prefix (`Мысль:`, `Решение:`, `Вопрос:`, etc.); a deeper typed-event schema remains future work if period reports need filtering by kind."
    x:
      ops:
        attention_class: done
  ts.in_day_structure.day_observation_log:
    title: Keep dogfood day observations inside Timeskein
    kind: task
    parent: ts.in_day_structure
    status: in_progress
    effort: 2
    deps:
      - id: ts.in_day_structure.active_work_journal
      - id: ts.day_review.day_events
    notes: "In progress. The active-focus journal and existing Day Events now provide the mechanics for recording product observations, working thoughts, recovery notes, and self-coordination comments inside Timeskein. The remaining proof is dogfood: one day should run without a parallel 'Timeskein, day N' note in Codex, and the evening report should contain enough observations to reconstruct the day."
    x:
      ops:
        attention_class: current
  ts.in_day_structure.work_item_stages:
    title: Track stages inside a Work Item
    kind: task
    parent: ts.in_day_structure
    status: planned
    effort: 5
    deps:
      - id: ts.in_day_structure.active_work_journal
    notes: "Allow a Work Item such as '1x1 + preparation + post-analysis' to have explicit stages. Focus blocks should optionally attach to a stage, reports should show time by stage, and stage changes should not require splitting the Work Item into fake separate tasks."
    x:
      ops:
        attention_class: future
  ts.in_day_structure.zone_dashboard:
    title: Show Activity Zone totals during the day
    kind: task
    parent: ts.in_day_structure
    status: done
    effort: 2
    deps:
      - id: ts.daily_control.goal_check
    notes: "Done as the first in-day-structure slice. The Today panel shows live zone totals with working occupancy (`Work + Coordination`), executive work (`Work`), non-work tracked time, and chips for the visible Activity Zones. The `Учёл зоны` action records `activity_zone_glanced`, and dogfood reports/RC checks now expect two in-day glances or an explicit evening `Зоны верны` acceptance. UI and CLI reports use the same totals, so coordination is treated as work-shaped load without inflating executive work."
    x:
      ops:
        attention_class: done
  ts.in_day_structure.dispatch_mode:
    title: Support day entry and dispatching mode
    kind: task
    parent: ts.in_day_structure
    status: in_progress
