version: 3

nodes:
  ts:
    title: Timeskein
    kind: product
    status: in_progress
    notes: Manual-first, local-first work inventory with the nearest product push toward Focus Session tracking.
    x:
      ops:
        attention_class: overview

  ts.baseline:
    title: Recovery baseline
    kind: phase
    parent: ts
    status: done
    notes: Browser dev mode and macOS app are usable; the Rust agent is embedded in the Tauri app.
    x:
      ops:
        attention_class: done
  ts.baseline.browser_dev:
    title: Browser development mode with mock API
    kind: task
    parent: ts.baseline
    status: done
    effort: 2
    x:
      ops:
        attention_class: done
  ts.baseline.macos_app:
    title: macOS app with embedded Rust agent
    kind: task
    parent: ts.baseline
    status: done
    effort: 4
    deps:
      - id: ts.baseline.browser_dev
    x:
      ops:
        attention_class: done
  ts.baseline.docs:
    title: Current implementation documentation
    kind: task
    parent: ts.baseline
    status: done
    effort: 1
    deps:
      - id: ts.baseline.macos_app
    x:
      ops:
        attention_class: done

  ts.ux_entry:
    title: App entry UX
    kind: phase
    parent: ts
    status: in_progress
    notes: Make opening, moving, hiding, and using the app feel like a fast time-tracking tool rather than a static palette.
    x:
      ops:
        attention_class: current
  ts.ux_entry.window_drag:
    title: Make the app window movable
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.baseline.macos_app
    notes: Header drag uses Tauri startDragging, with buttons excluded from the drag region.
    x:
      ops:
        attention_class: current
  ts.ux_entry.hide_toggle:
    title: Add clear hide and show behavior
    kind: task
    parent: ts.ux_entry
    status: done
    effort: 1
    deps:
      - id: ts.ux_entry.window_drag
    notes: A shown window must be easy to dismiss without quitting the whole app.
    x:
      ops:
        attention_class: current
  ts.ux_entry.tray_actions:
    title: Wire tray menu actions
    kind: task
    parent: ts.ux_entry
    status: in_progress
    effort: 1
    deps:
      - id: ts.ux_entry.hide_toggle
    notes: Left-click and Show/Hide toggle the window. The menu bar item also shows a short active focus counter. Settings still needs a visible destination.
    x:
      ops:
        attention_class: current
  ts.ux_entry.monitor_policy:
    title: Document macOS multi-monitor status item limits
    kind: task
    parent: ts.ux_entry
    status: planned
    effort: 1
    deps:
      - id: ts.ux_entry.tray_actions
    notes: Prefer alternate entrypoints over pretending that Tauri can force the tray icon onto every menu bar.
    x:
      ops:
        attention_class: current
  ts.ux_entry.fast_track_flow:
    title: Reduce the path from intent to tracked work
    kind: task
    parent: ts.ux_entry
    status: in_progress
    effort: 2
    deps:
      - id: ts.ux_entry.tray_actions
    notes: Focus tracking can start from a free text intention or selected Work Item. First dogfood day exposed shortcut friction while typing, fixed by ignoring palette shortcuts inside editable fields.
    x:
      ops:
        attention_class: current

  ts.focus_core:
    title: Focus Session core
    kind: phase
    parent: ts
    status: in_progress
    notes: "Replace the useful part of Session: a 25-minute focus target that continues counting real contact time until manual stop."
    x:
      ops:
        attention_class: current
  ts.focus_core.model_migrations:
    title: Add FocusSession and SessionEvent persistence
    kind: task
    parent: ts.focus_core
    status: in_progress
    effort: 3
    deps:
      - id: ts.ux_entry.fast_track_flow
    notes: Initial FocusSession table is implemented. SessionEvent and pause accounting are not implemented yet.
    x:
      ops:
        attention_class: current
  ts.focus_core.contracts_api:
    title: Add contracts and Local API for focus sessions
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.focus_core.model_migrations
    notes: Browser mock and macOS embedded agent should expose the same focus-session surface.
    x:
      ops:
        attention_class: current
  ts.focus_core.timer_ui:
    title: Build focus timer UI with overflow
    kind: task
    parent: ts.focus_core
    status: done
    effort: 3
    deps:
      - id: ts.focus_core.contracts_api
    notes: Shows elapsed contact time, 25-minute target, progress, and positive overflow after the target is reached.
    x:
      ops:
        attention_class: current
  ts.focus_core.session_lifecycle:
    title: Implement start, pause, resume, stop, cancel
    kind: task
    parent: ts.focus_core
    status: in_progress
    effort: 3
    deps:
      - id: ts.focus_core.timer_ui
    x:
      ops:
        attention_class: current
  ts.focus_core.restart_restore:
    title: Restore running focus session after app restart
    kind: task
    parent: ts.focus_core
    status: done
    effort: 2
    deps:
      - id: ts.focus_core.session_lifecycle
    notes: Avoid losing a running session when the Tauri shell or frontend reloads.
    x:
      ops:
        attention_class: current
  ts.focus_core.work_item_binding:
    title: Bind focus sessions to Work Items or free intentions
    kind: task
    parent: ts.focus_core
    status: done
    effort: 2
    deps:
      - id: ts.focus_core.contracts_api
    x:
      ops:
        attention_class: current
  ts.focus_core.session_notes:
    title: Capture a note at the end of a focus session
    kind: task
    parent: ts.focus_core
    status: done
    effort: 1
    deps:
      - id: ts.focus_core.session_lifecycle
    x:
      ops:
        attention_class: current
  ts.focus_core.dogfood_gate:
    title: First real Focus Session dogfood
    kind: milestone
    parent: ts.focus_core
    status: done
    milestone: true
    deps:
      - id: ts.focus_core.restart_restore
      - id: ts.focus_core.work_item_binding
      - id: ts.focus_core.session_notes
    notes: "First real dogfood day completed on 2026-07-01: 6:11:08 tracked focus, 20 entrances, useful gaps, Work Item totals, and app telemetry. The trial found real friction, but the core Session replacement loop produced usable day data."
    x:
      ops:
        attention_class: current

  ts.day_review:
    title: Day review and export
    kind: phase
    parent: ts
    status: in_progress
    notes: Turn raw sessions and local app telemetry into the working-day picture needed for productivity analysis.
    x:
      ops:
        attention_class: current
  ts.day_review.timeline:
    title: Show focus blocks on a daily timeline
    kind: task
    parent: ts.day_review
    status: in_progress
    effort: 3
    deps:
      - id: ts.focus_core.dogfood_gate
    x:
      ops:
        attention_class: current
  ts.day_review.totals_gaps:
    title: Compute totals, gaps, and entry count
    kind: task
    parent: ts.day_review
    status: in_progress
    effort: 2
    deps:
      - id: ts.day_review.timeline
    notes: Track total active time, number of focus entrances, gaps longer than 20 minutes, open gaps after the last stopped block, and target-reaching ratio.
    x:
      ops:
        attention_class: current
  ts.day_review.export:
    title: Export dogfood day data as Markdown
    kind: task
    parent: ts.day_review
    status: in_progress
    effort: 2
    deps:
      - id: ts.day_review.totals_gaps
    notes: Today can copy the raw day picture or a dogfood report with review prompts, and shows selected Markdown if clipboard access fails. UI and CLI reports are marked as draft when a focus session or Work Item is still active. SQLite fallback export, CLI dogfood report, and dogfood:finish end-of-day gate are implemented; finish refuses active focus sessions, stuck active Work Items, and empty days. JSON/CSV export remains future work.
    x:
      ops:
        attention_class: current
  ts.day_review.app_telemetry:
    title: Add local app-event telemetry for dogfood analysis
    kind: task
    parent: ts.day_review
    status: done
    effort: 2
    deps:
      - id: ts.day_review.export
    notes: SQLite app_events, Local API, UI/agent/script logging, metrics export, dogfood report section, and smoke coverage are implemented. Payloads must stay technical and must not store raw titles, notes, URLs, or typed text.
    x:
      ops:
        attention_class: current
  ts.day_review.analysis_gate:
    title: End-of-day analysis can use Timeskein data
    kind: milestone
    parent: ts.day_review
    status: done
    milestone: true
    deps:
      - id: ts.day_review.app_telemetry
    x:
      ops:
        attention_class: current

  ts.capture:
    title: Capture Inbox
    kind: phase
    parent: ts
    status: in_progress
    notes: Let incoming events be captured without interrupting the current focus block, then processed later into resolution, note, or Work Item. Minimal create/list/resolve/convert baseline is implemented and needs real dogfood.
    x:
      ops:
        attention_class: current
  ts.capture.model_api:
    title: Add captured-event model and Local API
    kind: task
    parent: ts.capture
    status: done
    effort: 3
    deps:
      - id: ts.day_review.analysis_gate
    notes: "Implemented SQLite captures table and Local API capture.create/list/resolve/convert_to_work_item. Captures store timestamp, text, optional focus-session link, optional Work Item link, and state: open, resolved, converted."
    x:
      ops:
        attention_class: current
  ts.capture.quick_ui:
    title: Add fast capture control
    kind: task
    parent: ts.capture
    status: done
    effort: 3
    deps:
      - id: ts.capture.model_api
    notes: "Implemented one small Capture input in the focus panel. Creating a capture is safe while a timer is running and does not create timed work."
    x:
      ops:
        attention_class: current
  ts.capture.review_flow:
    title: Review and promote captured events
    kind: task
    parent: ts.capture
    status: in_progress
    effort: 3
    deps:
      - id: ts.capture.quick_ui
    notes: Open captures can be resolved or converted to a Work Item. Append-as-timestamped-note, edit/delete, and a fuller history view remain future work.
    x:
      ops:
        attention_class: current

  ts.hardening:
    title: Dogfood hardening
    kind: phase
    parent: ts
    status: in_progress
    notes: Stabilize the first useful product slice without broadening scope to Evidence Mode or sync.
    x:
      ops:
        attention_class: current
  ts.hardening.smoke:
    title: Add smoke checks for focus-session flows
    kind: task
    parent: ts.hardening
    status: in_progress
    effort: 2
    deps:
      - id: ts.day_review.analysis_gate
    notes: dogfood:preflight covers script syntax, contracts build, desktop typecheck, Markdown export smoke, dogfood start/status/ready/rc-check/reset/stop-active/open-app smoke, packaged macOS build, embedded agent smoke, focus switching, capture API, stale lock/port recovery, and restart/restore. Browser UI smoke is still manual.
    x:
      ops:
        attention_class: current
  ts.hardening.post_dogfood_friction:
    title: Fix first dogfood friction
    kind: task
    parent: ts.hardening
    status: in_progress
    effort: 2
    deps:
      - id: ts.focus_core.dogfood_gate
    notes: Fix typing C/С opening Create, creating a new active Work Item, ambiguous last-seen timestamps, and add the first Capture Inbox baseline. Remaining friction goes to activity zones, editable stop notes, and timeline notes.
    x:
      ops:
        attention_class: current
  ts.hardening.backup_reset:
    title: Add local data backup and reset path
    kind: task
    parent: ts.hardening
    status: done
    effort: 2
    deps:
      - id: ts.day_review.analysis_gate
    notes: dogfood:reset-db dry-runs by default, moves timeskein.db plus SQLite sidecar files to timestamped backup names only after explicit --apply, and refuses while the embedded agent or app process is alive unless --force is passed. dogfood:ready prints a manual backup command for the main DB file and shows running app PIDs.
    x:
      ops:
        attention_class: current
  ts.hardening.package_app:
    title: Rebuild macOS app for regular personal use
    kind: task
    parent: ts.hardening
    status: done
    effort: 1
    deps:
      - id: ts.hardening.smoke
    x:
      ops:
        attention_class: current
  ts.hardening.release_notes:
    title: Write dogfood release notes and known limitations
    kind: task
    parent: ts.hardening
    status: planned
    effort: 1
    deps:
      - id: ts.hardening.package_app
      - id: ts.hardening.backup_reset
    notes: Dogfood Release Candidate doc defines the pass/fail gate. dogfood:rc-check turns the saved SQLite day into hard blockers, review items, and manual verdict prompts.
    x:
      ops:
        attention_class: current
  ts.hardening.dogfood_release:
    title: Session replacement dogfood baseline
    kind: milestone
    parent: ts.hardening
    status: planned
    milestone: true
    deps:
      - id: ts.hardening.release_notes
    notes: Timeskein can replace the free Session timer for personal tracking.
    x:
      ops:
        attention_class: current

  ts.future:
    title: Future directions
    kind: phase
    parent: ts
    status: deferred
    notes: Important, but intentionally not decomposed before the Focus Session slice proves useful.
    x:
      ops:
        attention_class: future
  ts.future.manual_inventory_completion:
    title: Complete broader Manual Inventory UX
    kind: epic
    parent: ts.future
    status: deferred
    effort: 8
    notes: Refs, settings, denylist, opening files, and polish beyond the tracking-day slice.
    x:
      ops:
        attention_class: future
  ts.future.windows:
    title: Windows packaging and tray behavior
    kind: epic
    parent: ts.future
    status: deferred
    effort: 8
    x:
      ops:
        attention_class: future
  ts.future.android:
    title: Android client path
    kind: epic
    parent: ts.future
    status: deferred
    effort: 8
    x:
      ops:
        attention_class: future
  ts.future.sync:
    title: Sync and multi-device continuity
    kind: epic
    parent: ts.future
    status: deferred
    effort: 13
    x:
      ops:
        attention_class: future
  ts.future.context_capture:
    title: Explicit context capture and SourceNodes
    kind: epic
    parent: ts.future
    status: deferred
    effort: 13
    x:
      ops:
        attention_class: future
  ts.future.evidence:
    title: Evidence Mode
    kind: epic
    parent: ts.future
    status: deferred
    effort: 20
    notes: Keep opt-in and post-MVP.
    x:
      ops:
        attention_class: future
  ts.future.active_window:
    title: Active-window and automation experiments
    kind: epic
    parent: ts.future
    status: deferred
    effort: 8
    notes: Explore only after the manual timer data is useful.
    x:
      ops:
        attention_class: future
