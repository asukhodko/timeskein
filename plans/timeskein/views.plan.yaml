    title: Timeskein now
    where:
      x_ops_attention_class:
        - now
        - current
      status:
        - in_progress
        - planned
        - blocked
    order_by: status
  next:
    title: Timeskein next risk-reduction work
    where:
      x_ops_attention_class:
        - next
      status:
        - in_progress
        - planned
        - blocked
    order_by: status
  north-star:
    title: Timeskein north-star capability map
    where:
      x_ops_attention_class:
        - overview
        - now
        - next
        - later
    order_by: title
  risk-gates:
    title: Timeskein strategic dogfood gates
    where:
      kind:
        - milestone
      x_ops_attention_class:
        - now
        - next
        - later
    order_by: title
  backlog:
    title: Timeskein later and maintenance work
    where:
      x_ops_attention_class:
        - later
        - future
    order_by: title
  current-gantt:
    title: Timeskein accepted history and committed work
    where:
      has_schedule: true
    window_start: "2026-06-30"
    window_finish: "2026-07-18"
    date_format: YYYY-MM-DD
    axis_format: "%d.%m"
    lanes:
      accepted-manual:
        title: Accepted manual gates
        nodes:
          - ts.baseline.docs
          - ts.focus_core.dogfood_gate
          - ts.day_review.analysis_gate
          - ts.hardening.dogfood_release
          - ts.daily_control.goal_check
      accepted-meaning:
        title: Accepted meaning gates
        nodes:
          - ts.in_day_structure.dogfood_gate
          - ts.periodic_reflection.reflection_sessions
          - ts.periodic_reflection.semantic_dogfood_gate
          - ts.periodic_reflection.context_links
      causal-memory:
        title: North-star architecture
        nodes:
          - ts.causal_memory.architecture_gate
          - ts.causal_memory.provenance_contract
          - ts.causal_memory.transition_history
          - ts.periodic_reflection.operational_reality
          - ts.steering.manual_correction
          - ts.steering.operational_reality_gate

x:
  strategy:
    north_star: Connect intention, work episode, context, change, evidence, decision, and next action into one local and historically honest causal memory.
    planning_mode: backcasting-with-risk-gates
    horizons:
      now:
        outcome: Establish the causal spine and prove explainable Operational Reality on real work.
      next:
        outcome: Test bounded automatic context before committing to a SourceNode platform.
      later:
        outcome: Build explainable Episodes, private intelligence, multi-device continuity, and opt-in Full Context.
    invariants:
      - Manual mode remains fully useful.
      - User-confirmed state and decisions are authoritative.
      - Observations and machine interpretations keep explicit provenance.
      - Raw sensitive artifacts are ephemeral and revocable.
      - Duration is evidence of effort, not proof of result.
      - Far work is not scheduled before its preceding risk gate passes.
  exec:
    program:
      committed_date: "2026-07-16"
      nearest_goal: Choose the first post-M1 result from Operational Workspace convergence, Working Memory Bridge, or Bounded Context Capture Probe.
      success_by_next_sync: One successor has a bounded user result, explicit exclusions, and a real dogfood gate; the other candidates remain visible without accidental commitment.
      note: Causal Work Spine and Operational Reality v1 passed real use on 15–16 July. Timeline integrity is hardened after the gate exposed a 9:05 overlap. The next decision is integration/evidence quality versus early automatic-context risk reduction.
    defaults:
      weight_strategy: effort_effective
      status_progress:
        done: 1.0
        in_progress: 0.5
        planned: 0.0
        deferred: 0.0
        blocked: 0.0
    blocks:
      accepted-foundation:
        title: Accepted manual foundation
        scope_nodes:
          - ts.baseline
          - ts.ux_entry
          - ts.focus_core
          - ts.day_review
          - ts.capture
          - ts.hardening
          - ts.daily_control
          - ts.in_day_structure
          - ts.periodic_reflection
        target_gate: ts.periodic_reflection.context_links
        progress_override: 1.0
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Daily control, in-day structure, Tracks, period reviews, evidence, and decision follow-up are accepted as the Manual Source foundation.
      architecture-gate:
        title: North-star architecture gate
        scope_nodes:
          - ts.causal_memory.architecture_gate
        target_gate: ts.causal_memory.architecture_gate
        progress_override: 1.0
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: ADR-0004, RFC-0009, Roadmap 0005, and opskarta define causal truth boundaries, horizons, and risk gates.
      causal-memory:
        title: Causal Work Memory
        scope_nodes:
          - ts.causal_memory
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: The manual causal spine, evidence chain, historical correction, and non-overlapping timeline baseline are accepted. Working Memory Bridge remains an optional next candidate; broader observation provenance belongs to the context probe.
      current-steering:
        title: Current-State Steering
        scope_nodes:
          - ts.steering
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Operational Reality passed the 15–16 July real-use gate with 11 starts, persistent correction, Reflection follow-up, and a complete causal chain. Workspace convergence is the optional next integration candidate.
      trust-controls:
        title: Trust and privacy controls
        scope_nodes:
          - ts.trust
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Pull forward only the controls required before any automatic context probe.
      bounded-context-probe:
        title: Bounded context probe
        scope_nodes:
          - ts.context_fabric.observation_envelope
          - ts.context_fabric.bounded_probe
          - ts.context_fabric.bounded_probe_gate
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Risk-first alternative candidate. Collect only during manual focus and decide from measured re-entry/evidence value.
      context-fabric:
        title: Context Fabric
        scope_nodes:
          - ts.context_fabric
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Generalize sources only after the bounded probe passes its value and trust gate.
      private-intelligence:
        title: Explainable private intelligence
        scope_nodes:
          - ts.intelligence
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Episodes, Threads, in-app reflection, and cited LLM analysis remain after causal and context gates.
      continuity:
        title: Multi-device continuity
        scope_nodes:
          - ts.continuity
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Keep new canonical facts sync-ready; defer Hub and platform expansion until evidence of multi-device value.
      full-context:
        title: Opt-in Full Context
        scope_nodes:
          - ts.full_context
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Expand Evidence Mode only from a proven Context Fabric with working TTL, purge, revocation, and manual authority.
      maintenance:
        title: Maintenance and polish
        scope_nodes:
          - ts.future
          - ts.in_day_structure.search_normalization
          - ts.in_day_structure.ui_readability_polish
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Pull a polish item forward only when dogfood shows it blocks trust or the selected goal.
    edges:
      - from: accepted-foundation
        to: architecture-gate
        type: required
      - from: architecture-gate
        to: causal-memory
        type: required
      - from: causal-memory
        to: current-steering
        type: required
      - from: architecture-gate
        to: trust-controls
        type: required
      - from: causal-memory
        to: bounded-context-probe
        type: required
      - from: trust-controls
        to: bounded-context-probe
        type: required
      - from: bounded-context-probe
        to: context-fabric
        type: required
      - from: current-steering
        to: private-intelligence
        type: required
      - from: context-fabric
        to: private-intelligence
        type: required
      - from: causal-memory
        to: continuity
        type: context
        label: sync-ready first
      - from: context-fabric
        to: full-context
        type: required
      - from: private-intelligence
        to: full-context
        type: context
        label: derived meaning
      - from: continuity
        to: full-context
        type: context
        label: multi-device sources
    views:
      exec-top:
        blocks:
          - accepted-foundation
          - architecture-gate
          - causal-memory
          - current-steering
          - trust-controls
          - bounded-context-probe
          - context-fabric
          - private-intelligence
          - continuity
          - full-context
        direction: LR
        color_mode: mgmt_hybrid
        highlight_current: true
        show_progress: true
        show_gate_date: true
        show_owner: false
        wrap_title_lines: 2
        reduce_transitive_required_edges: true
        caption: "The accepted manual foundation now includes Causal Work Spine and Operational Reality v1. The next decision is whether to converge the operational workspace, strengthen manual working memory, or test bounded automatic context before broader Context Fabric, private intelligence, continuity, and opt-in Full Context."
      exec-active-tracks:
        blocks:
          - architecture-gate
          - causal-memory
          - current-steering
          - trust-controls
          - bounded-context-probe
        direction: TD
        color_mode: mgmt_hybrid
        highlight_current: true
        show_progress: true
        show_gate_date: true
