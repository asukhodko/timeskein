version: 3

views:
  current:
    title: Current Timeskein work
    where:
      x_ops_attention_class:
        - current
    order_by: status
  backlog:
    title: Deferred Timeskein work
    where:
      x_ops_attention_class:
        - future
    order_by: title
  current-gantt:
    title: Timeskein daily-control dogfood slice
    where:
      has_schedule: true
    window_start: "2026-06-30"
    window_finish: "2026-08-14"
    date_format: YYYY-MM-DD
    axis_format: "%d.%m"
    lanes:
      app-entry:
        title: App entry UX
        nodes:
          - ts.ux_entry
        expand_descendants: leaves
      focus-core:
        title: Focus Session core
        nodes:
          - ts.focus_core
        expand_descendants: leaves
      day-review:
        title: Day review
        nodes:
          - ts.day_review
        expand_descendants: leaves
      capture:
        title: Capture Inbox
        nodes:
          - ts.capture
        expand_descendants: leaves
      hardening:
        title: Dogfood hardening
        nodes:
          - ts.hardening
        expand_descendants: leaves
      daily-control:
        title: Daily Control Gate
        nodes:
          - ts.daily_control
        expand_descendants: leaves

x:
  exec:
    program:
      committed_date: "2026-06-30"
      note: The Session replacement baseline is accepted; the next useful product slice is proving the daily-control loop on one real day.
    defaults:
      weight_strategy: effort_effective
      status_progress:
        done: 1.0
        in_progress: 0.5
        planned: 0.0
        deferred: 0.0
        blocked: 0.0
    blocks:
      recovered-baseline:
        title: Recovered baseline
        scope_nodes:
          - ts.baseline
        target_gate: ts.baseline.docs
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Browser and macOS are usable enough for the next slice.
      app-entry-ux:
        title: App entry UX
        scope_nodes:
          - ts.ux_entry
        target_gate: ts.ux_entry.fast_track_flow
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Entry and return paths are implemented; the daily-control gate will verify their real-day cost through show and hide request telemetry.
      focus-session-core:
        title: Focus Session core
        scope_nodes:
          - ts.focus_core
        target_gate: ts.focus_core.dogfood_gate
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Manual start, switch, stop, restore, overflow, and stop notes are accepted as the Session replacement baseline. Pause/resume/cancel are deferred.
      day-review-export:
        title: Day review and export
        scope_nodes:
          - ts.day_review
        target_gate: ts.day_review.analysis_gate
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Dogfood days produced usable focus data without Session; missed/stopped blocks can now be added, corrected, or split before copying the final report.
      capture-inbox:
        title: Capture Inbox
        scope_nodes:
          - ts.capture
        target_gate: ts.capture.review_flow
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: 2026-07-03 dogfood created four captures during active focus; resolve/convert/report flow worked with zero capture failures.
      dogfood-hardening:
        title: Dogfood hardening
        scope_nodes:
          - ts.hardening
        target_gate: ts.hardening.dogfood_release
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: macOS Session replacement dogfood baseline accepted on 2026-07-03; post-factum correction covers missed-block creation, edit, and split, window request telemetry is ready for the next entry-polish dogfood gate, and dogfood:continue now reopens an existing day through the guarded launch path.
      daily-control-gate:
        title: Daily Control Gate
        scope_nodes:
          - ts.daily_control
        target_gate: ts.daily_control.goal_check
        mgmt:
          health: yellow
          owner: a.sukhodko
          next_sync_goal: Run one measured evening closure from the review panel, copy a final report in <=10 minutes, save evidence, and pass strict dogfood:goal-check with --no-codex-guidance.
      periodic-reflection:
        title: Periodic Reflection
        scope_nodes:
          - ts.periodic_reflection
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: "Next meaning layer after the daily-control loop: arbitrary-period reports, focus tuning, Track/Label slices, operational reality, and performance-review evidence. First slice should use existing manual data before adding automated context collection."
      future-directions:
        title: Future directions
        scope_nodes:
          - ts.future
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Keep broad ideas visible without pretending they are ready to schedule.
    edges:
      - from: recovered-baseline
        to: app-entry-ux
        type: required
      - from: app-entry-ux
        to: focus-session-core
        type: required
      - from: focus-session-core
        to: day-review-export
        type: required
      - from: day-review-export
        to: capture-inbox
        type: required
      - from: capture-inbox
        to: dogfood-hardening
        type: required
      - from: dogfood-hardening
        to: daily-control-gate
        type: required
      - from: daily-control-gate
        to: periodic-reflection
        type: required
      - from: periodic-reflection
        to: future-directions
        type: context
        label: later
    views:
      exec-top:
        blocks:
          - recovered-baseline
          - app-entry-ux
          - focus-session-core
          - day-review-export
          - capture-inbox
          - dogfood-hardening
          - daily-control-gate
          - periodic-reflection
          - future-directions
        direction: LR
        color_mode: mgmt_hybrid
        highlight_current: true
        show_progress: true
        show_gate_date: true
        show_owner: false
        wrap_title_lines: 2
        reduce_transitive_required_edges: true
        caption: "Near-term plan should stay narrow: reduce daily-review friction and choose the next measurable gate before reopening sync, Evidence Mode, or platform expansion."
      exec-active-tracks:
        blocks:
          - app-entry-ux
          - day-review-export
          - capture-inbox
          - dogfood-hardening
          - daily-control-gate
        direction: TD
        color_mode: mgmt_hybrid
        highlight_current: true
        show_progress: true
        show_gate_date: true
