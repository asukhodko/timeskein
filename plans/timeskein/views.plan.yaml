version: 3

views:
  current:
    title: Timeskein now
    where:
      x_ops_attention_class:
        - now
        - current
      status:
        - in_progress
        - planned
        - blocked
    order_by: status
  next:
    title: Timeskein next risk-reduction work
    where:
      x_ops_attention_class:
        - next
      status:
        - in_progress
        - planned
        - blocked
    order_by: status
  north-star:
    title: Timeskein north-star capability map
    where:
      x_ops_attention_class:
        - overview
        - now
        - next
        - later
    order_by: title
  risk-gates:
    title: Timeskein strategic dogfood gates
    where:
      kind:
        - milestone
      x_ops_attention_class:
        - now
        - next
        - later
    order_by: title
  backlog:
    title: Timeskein later and maintenance work
    where:
      x_ops_attention_class:
        - later
        - future
    order_by: title
  current-gantt:
    title: Timeskein accepted history and committed work
    where:
      has_schedule: true
    window_start: "2026-06-30"
    window_finish: "2026-07-31"
    date_format: YYYY-MM-DD
    axis_format: "%d.%m"
    lanes:
      accepted-manual:
        title: Accepted manual gates
        nodes:
          - ts.baseline.docs
          - ts.focus_core.dogfood_gate
          - ts.day_review.analysis_gate
          - ts.hardening.dogfood_release
          - ts.daily_control.goal_check
      accepted-meaning:
        title: Accepted meaning gates
        nodes:
          - ts.in_day_structure.dogfood_gate
          - ts.periodic_reflection.reflection_sessions
          - ts.periodic_reflection.semantic_dogfood_gate
          - ts.periodic_reflection.context_links
      causal-memory:
        title: North-star architecture
        nodes:
          - ts.causal_memory.architecture_gate
          - ts.causal_memory.provenance_contract
          - ts.causal_memory.transition_history
          - ts.periodic_reflection.operational_reality
          - ts.steering.manual_correction
          - ts.steering.operational_reality_gate
      operational-workspace:
        title: Accepted operational workspace
        nodes:
          - ts.steering.workspace_day_contract
          - ts.steering.workspace_primary_surface
          - ts.steering.workspace_reentry
          - ts.steering.workspace_explainability
          - ts.steering.workspace_gate
      working-memory:
        title: Working memory implementation and re-entry gate
        nodes:
          - ts.causal_memory.working_memory_stream
          - ts.causal_memory.context_pack_v1
          - ts.in_day_structure.work_item_stages
          - ts.in_day_structure.rich_note_review
          - ts.in_day_structure.visible_causality
          - ts.causal_memory.working_memory_gate

x:
  strategy:
    north_star: Connect intention, work episode, context, change, evidence, decision, and next action into one local and historically honest causal memory.
    planning_mode: backcasting-with-risk-gates
    horizons:
      now:
        outcome: Accept Working Memory Bridge on one real long-lived Work Item through distinct 1-, 3-, and 7-day re-entry without an external notebook.
      next:
        outcome: Carry confirmed causal change into period reviews, clarify and prune incoming inventory, then test one bounded automatic context source behind trust controls.
      later:
        outcome: Generalize a proven bounded source into Context Fabric, then build explainable Episodes, private intelligence, multi-device continuity, and opt-in Full Context.
    invariants:
      - Manual mode remains fully useful.
      - User-confirmed state and decisions are authoritative.
      - Observations and machine interpretations keep explicit provenance.
      - Raw sensitive artifacts are ephemeral and revocable.
      - Duration is evidence of effort, not proof of result.
      - Existing incoming fragments are clarified and pruned before automatic sources add more.
      - Far work is not scheduled before its preceding risk gate passes.
  exec:
    program:
      committed_date: "2026-08-08"
      nearest_goal: Accept the implemented Working Memory Bridge through real 1/3/7-day re-entry.
      success_by_next_sync: Complete D0 on one long-lived Work Item with material, named stages, daily outcome, focus work, and a causal stop trace, then use Timeskein as the sole source for the scheduled returns.
      note: Operational Workspace is accepted and day 19 restored the explicit Reality/Contour boundary. Working Memory Bridge is code-ready; seven ordinary workdays are retained as a natural pre-D0 baseline, while the complete D0 setup and time-dependent re-entry gate remain open.
    defaults:
      weight_strategy: effort_effective
      status_progress:
        done: 1.0
        in_progress: 0.5
        planned: 0.0
        deferred: 0.0
        blocked: 0.0
    blocks:
      accepted-foundation:
        title: Accepted manual foundation
        scope_nodes:
          - ts.baseline
          - ts.ux_entry
          - ts.focus_core
          - ts.day_review
          - ts.capture
          - ts.hardening
          - ts.daily_control
          - ts.in_day_structure
          - ts.periodic_reflection
        target_gate: ts.periodic_reflection.context_links
        progress_override: 1.0
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Daily control, in-day structure, Tracks, period reviews, evidence, and decision follow-up are accepted as the Manual Source foundation.
      architecture-gate:
        title: North-star architecture gate
        scope_nodes:
          - ts.causal_memory.architecture_gate
        target_gate: ts.causal_memory.architecture_gate
        progress_override: 1.0
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: ADR-0004, RFC-0009, Roadmap 0005, and opskarta define causal truth boundaries, horizons, and risk gates.
      causal-memory:
        title: Causal Work Memory
        scope_nodes:
          - ts.causal_memory
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: The manual causal spine is accepted. Working Memory Bridge is implemented, with only its real 1/3/7-day re-entry gate still open.
      current-steering:
        title: Accepted Operational Reality
        scope_nodes:
          - ts.periodic_reflection.operational_reality
          - ts.steering.manual_correction
          - ts.steering.operational_reality_gate
        target_gate: ts.steering.operational_reality_gate
        progress_override: 1.0
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Operational Reality passed the 15–16 July real-use gate with 11 starts, persistent correction, Reflection follow-up, and a complete causal chain.
      operational-workspace:
        title: Operational Workspace convergence
        scope_nodes:
          - ts.steering.workspace_convergence
        target_gate: ts.steering.workspace_gate
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Accepted 2026-07-22 after four real days; contract, revision, re-entry, closure, integrity, and external-list boundaries passed.
      working-memory:
        title: Working Memory Bridge
        scope_nodes:
          - ts.causal_memory.working_memory_bridge
        target_gate: ts.causal_memory.working_memory_gate
        progress_override: 0.82
        mgmt:
          health: yellow
          owner: a.sukhodko
          sync_note: Code, API, UI, Context Packs, telemetry, CLI, tests, and protocol are implemented. Four real active entries prove the write path; same-day pre-focus memory/material, revision, stages, causal stop, and fresh final exports still precede D0 and the distinct 1/3/7-day returns. Every return must be the exact successful memory-started Focus Session and end with its own causal trace. Track and daily-outcome snapshots are already present.
      causal-period-review:
        title: Causal Period Review
        scope_nodes:
          - ts.periodic_reflection.causal_period_story
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Promote confirmed changes, decisions, unresolved commitments, and next actions into weekly and Track review after Working Memory acceptance.
      inventory-stewardship:
        title: Inventory Stewardship
        scope_nodes:
          - ts.stewardship
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Give captures, unknowns, stale tails, duplicates, and items without next actions an explicit fate before adding automatic context.
      trust-controls:
        title: Trust and privacy controls
        scope_nodes:
          - ts.trust
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Pull forward only the controls required before any automatic context probe.
      bounded-context-probe:
        title: Bounded context probe
        scope_nodes:
          - ts.context_fabric.observation_envelope
          - ts.context_fabric.bounded_probe
          - ts.context_fabric.bounded_probe_gate
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Run only after Working Memory, causal period review, inventory stewardship, and minimum trust controls pass. Collect during manual focus and decide from measured re-entry/evidence value.
      context-fabric:
        title: Context Fabric
        scope_nodes:
          - ts.context_fabric
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Generalize sources only after the bounded probe passes its value and trust gate.
      private-intelligence:
        title: Explainable private intelligence
        scope_nodes:
          - ts.intelligence
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Episodes, Threads, in-app reflection, and cited LLM analysis remain after causal and context gates.
      continuity:
        title: Multi-device continuity
        scope_nodes:
          - ts.continuity
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Keep new canonical facts sync-ready; defer Hub and platform expansion until evidence of multi-device value.
      full-context:
        title: Opt-in Full Context
        scope_nodes:
          - ts.full_context
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Expand Evidence Mode only from a proven Context Fabric with working TTL, purge, revocation, and manual authority.
      maintenance:
        title: Maintenance and polish
        scope_nodes:
          - ts.future
          - ts.in_day_structure.search_normalization
          - ts.in_day_structure.ui_readability_polish
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Pull a polish item forward only when dogfood shows it blocks trust or the selected goal.
    edges:
      - from: accepted-foundation
        to: architecture-gate
        type: required
      - from: architecture-gate
        to: causal-memory
        type: required
      - from: causal-memory
        to: current-steering
        type: required
      - from: current-steering
        to: operational-workspace
        type: required
      - from: operational-workspace
        to: working-memory
        type: required
      - from: working-memory
        to: causal-period-review
        type: required
      - from: causal-period-review
        to: inventory-stewardship
        type: required
      - from: architecture-gate
        to: trust-controls
        type: required
      - from: inventory-stewardship
        to: bounded-context-probe
        type: required
      - from: trust-controls
        to: bounded-context-probe
        type: required
      - from: bounded-context-probe
        to: context-fabric
        type: required
      - from: causal-period-review
        to: private-intelligence
        type: required
      - from: context-fabric
        to: private-intelligence
        type: required
      - from: causal-memory
        to: continuity
        type: context
        label: sync-ready first
      - from: context-fabric
        to: full-context
        type: required
      - from: private-intelligence
        to: full-context
        type: context
        label: derived meaning
      - from: continuity
        to: full-context
        type: context
        label: multi-device sources
    views:
      exec-top:
        blocks:
          - accepted-foundation
          - architecture-gate
          - causal-memory
          - current-steering
          - operational-workspace
          - working-memory
          - causal-period-review
          - inventory-stewardship
          - trust-controls
          - bounded-context-probe
          - context-fabric
          - private-intelligence
          - continuity
          - full-context
        direction: LR
        color_mode: mgmt_hybrid
        highlight_current: true
        show_progress: true
        show_gate_date: true
        show_owner: false
        wrap_title_lines: 2
        reduce_transitive_required_edges: true
        caption: "Nineteen structured dogfood days accepted the operational workspace and clarified Reality as the derived foundation with Contour as its optional contract lens. Seven later ordinary workdays supplied a natural pre-D0 baseline: tracking remained stable, but working memory was not used without the explicit acceptance path. Working Memory Bridge is implemented, while the complete D0 baseline and distinct 1/3/7-day re-entry remain. Causal period review and inventory stewardship precede any bounded untrusted-context probe."
      exec-active-tracks:
        blocks:
          - architecture-gate
          - causal-memory
          - current-steering
          - operational-workspace
          - working-memory
          - causal-period-review
          - inventory-stewardship
          - trust-controls
          - bounded-context-probe
        direction: TD
        color_mode: mgmt_hybrid
        highlight_current: true
        show_progress: true
        show_gate_date: true
