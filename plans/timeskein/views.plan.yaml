version: 3

views:
  current:
    title: Timeskein now
    where:
      x_ops_attention_class:
        - now
        - current
      status:
        - in_progress
        - planned
        - blocked
    order_by: status
  next:
    title: Timeskein next risk-reduction work
    where:
      x_ops_attention_class:
        - next
      status:
        - in_progress
        - planned
        - blocked
    order_by: status
  north-star:
    title: Timeskein north-star capability map
    where:
      x_ops_attention_class:
        - overview
        - now
        - next
        - later
    order_by: title
  risk-gates:
    title: Timeskein strategic dogfood gates
    where:
      kind:
        - milestone
      x_ops_attention_class:
        - now
        - next
        - later
    order_by: title
  backlog:
    title: Timeskein later and maintenance work
    where:
      x_ops_attention_class:
        - later
        - future
    order_by: title
  current-gantt:
    title: Timeskein accepted history and committed work
    where:
      has_schedule: true
    window_start: "2026-06-30"
    window_finish: "2026-07-31"
    date_format: YYYY-MM-DD
    axis_format: "%d.%m"
    lanes:
      accepted-manual:
        title: Accepted manual gates
        nodes:
          - ts.baseline.docs
          - ts.focus_core.dogfood_gate
          - ts.day_review.analysis_gate
          - ts.hardening.dogfood_release
          - ts.daily_control.goal_check
      accepted-meaning:
        title: Accepted meaning gates
        nodes:
          - ts.in_day_structure.dogfood_gate
          - ts.periodic_reflection.reflection_sessions
          - ts.periodic_reflection.semantic_dogfood_gate
          - ts.periodic_reflection.context_links
      causal-memory:
        title: North-star architecture
        nodes:
          - ts.causal_memory.architecture_gate
          - ts.causal_memory.provenance_contract
          - ts.causal_memory.transition_history
          - ts.periodic_reflection.operational_reality
          - ts.steering.manual_correction
          - ts.steering.operational_reality_gate
      operational-workspace:
        title: Next operational workspace
        nodes:
          - ts.steering.workspace_day_contract
          - ts.steering.workspace_primary_surface
          - ts.steering.workspace_reentry
          - ts.steering.workspace_explainability
          - ts.steering.workspace_gate

x:
  strategy:
    north_star: Connect intention, work episode, context, change, evidence, decision, and next action into one local and historically honest causal memory.
    planning_mode: backcasting-with-risk-gates
    horizons:
      now:
        outcome: Accept the implemented convergence of Operational Reality, day contract, active focus, and secondary inventory on three real days.
      next:
        outcome: Replace the external working notebook, then carry confirmed causal change into period reviews.
      later:
        outcome: Test bounded automatic context, then build explainable Episodes, private intelligence, multi-device continuity, and opt-in Full Context.
    invariants:
      - Manual mode remains fully useful.
      - User-confirmed state and decisions are authoritative.
      - Observations and machine interpretations keep explicit provenance.
      - Raw sensitive artifacts are ephemeral and revocable.
      - Duration is evidence of effort, not proof of result.
      - Far work is not scheduled before its preceding risk gate passes.
  exec:
    program:
      committed_date: "2026-07-17"
      nearest_goal: Accept the implemented Operational Workspace on three full real days with one item-backed morning and re-entry loop.
      success_by_next_sync: Three contract/start/closure days, re-entry on two days, one honest revision, clean machine gate, and no external active-work list.
      note: The release candidate passed tests, browser inspection, release build, and packaged-app smoke on 2026-07-17. Product acceptance remains intentionally open; Working Memory Bridge follows the real-use gate.
    defaults:
      weight_strategy: effort_effective
      status_progress:
        done: 1.0
        in_progress: 0.5
        planned: 0.0
        deferred: 0.0
        blocked: 0.0
    blocks:
      accepted-foundation:
        title: Accepted manual foundation
        scope_nodes:
          - ts.baseline
          - ts.ux_entry
          - ts.focus_core
          - ts.day_review
          - ts.capture
          - ts.hardening
          - ts.daily_control
          - ts.in_day_structure
          - ts.periodic_reflection
        target_gate: ts.periodic_reflection.context_links
        progress_override: 1.0
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Daily control, in-day structure, Tracks, period reviews, evidence, and decision follow-up are accepted as the Manual Source foundation.
      architecture-gate:
        title: North-star architecture gate
        scope_nodes:
          - ts.causal_memory.architecture_gate
        target_gate: ts.causal_memory.architecture_gate
        progress_override: 1.0
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: ADR-0004, RFC-0009, Roadmap 0005, and opskarta define causal truth boundaries, horizons, and risk gates.
      causal-memory:
        title: Causal Work Memory
        scope_nodes:
          - ts.causal_memory
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: The manual causal spine, evidence chain, historical correction, and non-overlapping timeline baseline are accepted. Working Memory Bridge is committed after workspace convergence.
      current-steering:
        title: Accepted Operational Reality
        scope_nodes:
          - ts.periodic_reflection.operational_reality
          - ts.steering.manual_correction
          - ts.steering.operational_reality_gate
        target_gate: ts.steering.operational_reality_gate
        progress_override: 1.0
        mgmt:
          health: green
          owner: a.sukhodko
          sync_note: Operational Reality passed the 15–16 July real-use gate with 11 starts, persistent correction, Reflection follow-up, and a complete causal chain.
      operational-workspace:
        title: Operational Workspace convergence
        scope_nodes:
          - ts.steering.workspace_convergence
        target_gate: ts.steering.workspace_gate
        mgmt:
          health: yellow
          owner: a.sukhodko
          sync_note: Release candidate ready. Run the documented three-day protocol and strict gate; keep the inventory secondary and record whether any external active-list remains necessary.
      working-memory:
        title: Working Memory Bridge
        scope_nodes:
          - ts.causal_memory.working_memory_bridge
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Follows workspace acceptance. Replace the external notebook for chronological reasoning, materials, stages, and changed-state evidence.
      trust-controls:
        title: Trust and privacy controls
        scope_nodes:
          - ts.trust
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Pull forward only the controls required before any automatic context probe.
      bounded-context-probe:
        title: Bounded context probe
        scope_nodes:
          - ts.context_fabric.observation_envelope
          - ts.context_fabric.bounded_probe
          - ts.context_fabric.bounded_probe_gate
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Run only after the operational workspace and working-memory bridge are coherent. Collect during manual focus and decide from measured re-entry/evidence value.
      context-fabric:
        title: Context Fabric
        scope_nodes:
          - ts.context_fabric
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Generalize sources only after the bounded probe passes its value and trust gate.
      private-intelligence:
        title: Explainable private intelligence
        scope_nodes:
          - ts.intelligence
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Episodes, Threads, in-app reflection, and cited LLM analysis remain after causal and context gates.
      continuity:
        title: Multi-device continuity
        scope_nodes:
          - ts.continuity
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Keep new canonical facts sync-ready; defer Hub and platform expansion until evidence of multi-device value.
      full-context:
        title: Opt-in Full Context
        scope_nodes:
          - ts.full_context
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Expand Evidence Mode only from a proven Context Fabric with working TTL, purge, revocation, and manual authority.
      maintenance:
        title: Maintenance and polish
        scope_nodes:
          - ts.future
          - ts.in_day_structure.search_normalization
          - ts.in_day_structure.ui_readability_polish
        mgmt:
          health: neutral
          owner: a.sukhodko
          sync_note: Pull a polish item forward only when dogfood shows it blocks trust or the selected goal.
    edges:
      - from: accepted-foundation
        to: architecture-gate
        type: required
      - from: architecture-gate
        to: causal-memory
        type: required
      - from: causal-memory
        to: current-steering
        type: required
      - from: current-steering
        to: operational-workspace
        type: required
      - from: operational-workspace
        to: working-memory
        type: required
      - from: architecture-gate
        to: trust-controls
        type: required
      - from: working-memory
        to: bounded-context-probe
        type: required
      - from: trust-controls
        to: bounded-context-probe
        type: required
      - from: bounded-context-probe
        to: context-fabric
        type: required
      - from: working-memory
        to: private-intelligence
        type: required
      - from: context-fabric
        to: private-intelligence
        type: required
      - from: causal-memory
        to: continuity
        type: context
        label: sync-ready first
      - from: context-fabric
        to: full-context
        type: required
      - from: private-intelligence
        to: full-context
        type: context
        label: derived meaning
      - from: continuity
        to: full-context
        type: context
        label: multi-device sources
    views:
      exec-top:
        blocks:
          - accepted-foundation
          - architecture-gate
          - causal-memory
          - current-steering
          - operational-workspace
          - working-memory
          - trust-controls
          - bounded-context-probe
          - context-fabric
          - private-intelligence
          - continuity
          - full-context
        direction: LR
        color_mode: mgmt_hybrid
        highlight_current: true
        show_progress: true
        show_gate_date: true
        show_owner: false
        wrap_title_lines: 2
        reduce_transitive_required_edges: true
        caption: "Twelve real workdays selected a concrete route: converge the operational workspace, close the manual working-memory gap, strengthen causal period review, and only then test bounded automatic context before broader Context Fabric, private intelligence, continuity, and opt-in Full Context."
      exec-active-tracks:
        blocks:
          - architecture-gate
          - causal-memory
          - current-steering
          - operational-workspace
          - working-memory
          - trust-controls
          - bounded-context-probe
        direction: TD
        color_mode: mgmt_hybrid
        highlight_current: true
        show_progress: true
        show_gate_date: true
